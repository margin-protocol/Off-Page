<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色故事｜岔頁 OFF PAGE</title><meta name="description" content="岔頁角色故事館：選擇角色，翻閱各自的故事。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap"><style>
:root{--cream:#F7F3EC;--paper:#FFFDF9;--berry:#772F49;--ink:#29272B;--muted:#8A626E;--rule:#E7DBDC}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.9 "LXGW WenKai TC",serif}a{color:inherit}button{font:inherit;cursor:pointer;color:inherit;appearance:none}button:focus-visible,a:focus-visible{outline:2px solid var(--berry);outline-offset:3px}header{position:sticky;top:0;z-index:3;background:rgba(247,243,236,.97);border-bottom:1px solid var(--rule)}.wrap{max-width:1060px;margin:auto;padding:0 22px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px;flex-wrap:wrap}.logo{text-decoration:none;font-size:25px;color:var(--berry);font-weight:700}.logo small{font-size:13px;color:var(--muted);margin-left:10px}.back{font-size:14px;text-decoration:none;border-bottom:1px solid var(--berry);color:var(--berry)}main{padding:55px 22px 100px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);line-height:1.35;margin:10px 0 12px;color:var(--berry)}.lede{color:#5a5560;max-width:650px;margin:0 0 42px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.person{background:var(--paper);border:1px solid var(--rule);padding:26px;text-align:left;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}.person:hover{transform:translateY(-3px);border-color:var(--berry)}.person .thumb{height:145px;margin:-26px -26px 15px;background:linear-gradient(135deg,#EBCBD3,#F7F3EC,#D7B6A8);display:grid;place-items:center;overflow:hidden}.person .thumb img{width:100%;height:100%;object-fit:cover}.person .thumb span{font-size:40px;color:var(--berry)}.person .num{font-size:12px;color:var(--muted);letter-spacing:.16em}.person strong{font-size:27px}.person .desc{font-size:14px;color:#5a5560}.person .go{margin-top:auto;color:var(--berry);font-size:14px}.crumb{font-size:14px;color:var(--muted);margin-bottom:25px}.crumb button{border:0;background:none;color:var(--berry);padding:0}.story-list{list-style:none;padding:0;margin:30px 0;border-top:1px solid var(--ink)}.story-list li{border-bottom:1px solid var(--rule)}.story-list .entry{display:flex;align-items:center;gap:16px}.story-list .mini{width:76px;height:92px;flex:none;background:#EBCBD3;display:grid;place-items:center;color:var(--berry)}.story-list .mini img{width:100%;height:100%;object-fit:cover}.story-list .entry-text{display:flex;flex-direction:column}.story-list button{width:100%;border:0;background:none;padding:20px 4px;text-align:left;display:flex;justify-content:space-between;gap:20px}.story-list button:hover{color:var(--berry)}.story-list small{color:var(--muted)}.paper{background:var(--paper);border:1px solid var(--rule);padding:clamp(24px,5vw,60px);max-width:780px}.paper h1{color:var(--ink);font-size:36px}.story-cover,.story-figure img{display:block;width:100%;height:auto;border:1px solid var(--rule)}.story-cover{max-height:490px;object-fit:cover;margin:0 0 28px}.story-figure{margin:28px 0}.story-figure figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.prose{white-space:pre-wrap;line-height:2.15;overflow-wrap:anywhere}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.controls button{border:1px solid var(--rule);background:var(--paper);padding:8px 16px;color:var(--berry)}.controls button:disabled{opacity:.35;cursor:default}.empty{background:var(--paper);border:1px dashed var(--rule);padding:38px 24px;color:var(--muted)}footer{border-top:1px solid var(--rule);padding:24px 0;color:var(--muted);font-size:13px}@media(max-width:500px){main{padding-top:35px}.person{min-height:155px}}
</style></head><body><header><div class="wrap head"><a class="logo" href="./index.html#home">岔頁 <small>OFF PAGE</small></a><a class="back" href="./index.html#home">返回首頁 ↗</a></div></header><main class="wrap" id="app"></main><footer><div class="wrap">OFF PAGE — by Xia mumu · CHARACTER ARCHIVE</div></footer><script>
/* 故事可附圖：{title:"標題",content:"正文",date:"2026-11-11",cover:"images/cover.jpg",images:[{src:"images/scene.jpg",caption:"圖說"}]}。 */
const characters=[
{id:"wen",name:"聞止水",desc:"紀實攝影師｜棲川市",stories:[]},
{id:"xu",name:"徐汀云",desc:"犯罪學副教授｜棲川市",stories:[]},
{id:"you",name:"游未遲",desc:"法醫｜棲川市",stories:[]},
{id:"du",name:"杜今朝",desc:"刑警｜棲川市",stories:[]},
{id:"cheng",name:"程不言",desc:"刑事辯護律師｜棲川市",stories:[]},
{id:"lin",name:"林晏洄",desc:"環保顧問｜棲川市",stories:[]},
{id:"jian",name:"簡牧陽",desc:"空間設計師｜棲川市",stories:[]},
{id:"su",name:"蘇柏欽",desc:"廟宇彩繪與神像修復師",stories:[]},
{id:"fu",name:"傅承億",desc:"霸道乞丐｜都市荒誕喜劇",stories:[]},
{id:"lu",name:"陸承澤",desc:"從敵人到搭檔",stories:[]}
];
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeImage(src){const v=String(src||"").trim();return /^(https:\/\/|\.\/|images\/|assets\/)/i.test(v)&&!/[<>"\x00-\x1f]/.test(v)?esc(v):""}
function coverMarkup(src,label){const url=safeImage(src);return url?'<img src="'+url+'" alt="'+esc(label)+'" loading="lazy">':'<span aria-hidden="true">✦</span>'}
function imageGallery(story){const cover=safeImage(story.cover);const images=Array.isArray(story.images)?story.images:[];return (cover?'<img class="story-cover" src="'+cover+'" alt="'+esc(story.title)+' 封面" loading="lazy">':"")+images.map((item,i)=>{const img=typeof item==="string"?{src:item}:item||{};const src=safeImage(img.src);return src?'<figure class="story-figure"><img src="'+src+'" alt="'+esc(img.alt||story.title+" 插圖 "+(i+1))+'" loading="lazy">'+(img.caption?'<figcaption>'+esc(img.caption)+'</figcaption>':"")+'</figure>':""}).join("")}
function render(){const [,id,idx]=location.hash.slice(1).split("/");const c=characters.find(x=>x.id===id);document.title=(c?c.name+"｜":"角色故事｜")+"岔頁 OFF PAGE";if(!c){app.innerHTML='<div class="eyebrow">PAGE / CHARACTER ARCHIVE</div><h1>角色故事</h1><p class="lede">每個人都有自己的篇章。選一個名字，翻開那些還沒說完的故事。</p><div class="grid">'+characters.map((x,i)=>'<button class="person" data-id="'+esc(x.id)+'"><div class="thumb">'+coverMarkup(x.portrait,x.name)+'</div><span class="num">CHARACTER '+String(i+1).padStart(2,"0")+'</span><strong>'+esc(x.name)+'</strong><span class="desc">'+esc(x.desc)+'</span><span class="go">'+(x.stories.length?x.stories.length+" 篇故事":"故事目錄")+' →</span></button>').join("")+'</div>';app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>location.hash="/"+b.dataset.id);return}
const n=idx===undefined?NaN:Number(idx),story=Number.isInteger(n)&&n>=0?c.stories[n]:null;
const crumb='<div class="crumb"><button id="all">角色故事</button> / '+esc(c.name)+(story?' / '+esc(story.title):'')+'</div>';
if(!story){app.innerHTML=crumb+'<div class="eyebrow">CHARACTER FILE / '+esc(c.id.toUpperCase())+'</div><h1>'+esc(c.name)+'</h1><p class="lede">'+esc(c.desc)+'</p>'+(c.stories.length?'<ol class="story-list">'+c.stories.map((s,i)=>'<li><button data-story="'+i+'"><span class="entry"><span class="mini">'+coverMarkup(s.cover,s.title)+'</span><span class="entry-text"><span>'+String(i+1).padStart(2,"0")+'　'+esc(s.title)+'</span><small>'+esc(s.date||"")+'</small></span></span><small>閱讀 →</small></button></li>').join("")+'</ol>':'<div class="empty">這位角色的故事正在整理中，敬請期待。</div>');app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>location.hash="/"+c.id+"/"+b.dataset.story)}
else{app.innerHTML=crumb+'<article class="paper"><div class="eyebrow">'+esc(c.name)+' / STORY '+String(n+1).padStart(2,"0")+'</div><h1>'+esc(story.title)+'</h1><p class="eyebrow">'+esc(story.date||"")+'</p>'+imageGallery(story)+'<div class="prose">'+esc(story.content)+'</div></article><div class="controls"><button id="prev" '+(n===0?"disabled":"")+'>← 上一篇</button><button id="catalog">返回故事目錄</button><button id="next" '+(n===c.stories.length-1?"disabled":"")+'>下一篇 →</button></div>';app.querySelector("#catalog").onclick=()=>location.hash="/"+c.id;app.querySelector("#prev").onclick=()=>location.hash="/"+c.id+"/"+(n-1);app.querySelector("#next").onclick=()=>location.hash="/"+c.id+"/"+(n+1)}
app.querySelector("#all").onclick=()=>location.hash="/";window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script></body></html>
