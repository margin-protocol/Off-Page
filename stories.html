:root{--cream:#F7F3EC;--paper:#FFFDF9;--berry:#772F49;--ink:#29272B;--muted:#8A626E;--rule:#E7DBDC}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.9 "LXGW WenKai TC",serif}a{color:inherit}button{font:inherit;cursor:pointer;color:inherit;appearance:none}button:focus-visible,a:focus-visible{outline:2px solid var(--berry);outline-offset:3px}header{position:sticky;top:0;z-index:3;background:rgba(247,243,236,.97);border-bottom:1px solid var(--rule)}.wrap{max-width:1060px;margin:auto;padding:0 22px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px;flex-wrap:wrap}.logo{text-decoration:none;font-size:25px;color:var(--berry);font-weight:700}.logo small{font-size:13px;color:var(--muted);margin-left:10px}.back{font-size:14px;text-decoration:none;border-bottom:1px solid var(--berry);color:var(--berry)}main.wrap{padding:55px 22px 100px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);line-height:1.35;margin:10px 0 12px;color:var(--berry)}.lede{color:#5a5560;max-width:650px;margin:0 0 42px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.person{background:var(--paper);border:1px solid var(--rule);padding:26px;text-align:left;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}.person:hover{transform:translateY(-3px);border-color:var(--berry)}.person .thumb{height:145px;margin:-26px -26px 15px;background:linear-gradient(135deg,#EBCBD3,#F7F3EC,#D7B6A8);display:grid;place-items:center;overflow:hidden}.person .thumb img{width:100%;height:100%;object-fit:cover}.person .thumb span{font-size:40px;color:var(--berry)}.person .num{font-size:12px;color:var(--muted);letter-spacing:.16em}.person strong{font-size:27px}.person .desc{font-size:14px;color:#5a5560}.person .go{margin-top:auto;color:var(--berry);font-size:14px}.crumb{font-size:14px;color:var(--muted);margin-bottom:25px}.crumb button{border:0;background:none;color:var(--berry);padding:0}.story-list{list-style:none;padding:0;margin:30px 0;border-top:1px solid var(--ink)}.story-list li{border-bottom:1px solid var(--rule)}.story-list .entry{display:flex;align-items:center;gap:16px}.story-list .mini{position:relative;display:block;overflow:hidden;width:76px;min-width:76px;max-width:76px;height:92px;min-height:92px;max-height:92px;flex:0 0 76px;align-self:center;background:#EBCBD3;color:var(--berry);text-align:center;line-height:92px}.story-list .mini img{position:absolute;top:0;left:0;display:block;width:100%;height:100%;max-width:none;object-fit:cover}.story-list .entry-text{min-width:0}.story-list .entry-text{display:flex;flex-direction:column}.story-list button{width:100%;border:0;background:none;padding:20px 4px;text-align:left;display:flex;justify-content:space-between;gap:20px}.story-list button:hover{color:var(--berry)}.story-list small{color:var(--muted)}.story-list button>small{white-space:nowrap;flex:none}.paper{background:var(--paper);border:1px solid var(--rule);padding:clamp(24px,5vw,60px);max-width:780px}.paper h1{color:var(--ink);font-size:36px}.story-cover,.story-figure img{display:block;width:100%;height:auto;border:1px solid var(--rule)}.story-cover{max-width:560px;margin:0 auto 28px}.story-figure{margin:28px 0}.story-figure figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.prompt{margin:0 0 30px;padding:12px 16px;border-left:3px solid var(--berry);background:var(--cream);font-size:15px;line-height:1.8}.prompt span{display:block;font-size:12px;letter-spacing:.16em;color:var(--muted)}.pair{display:block;margin-top:40px;padding:16px 20px;border:1px solid var(--rule);text-decoration:none;color:var(--ink);font-size:17px}.pair span{display:block;font-size:13px;letter-spacing:.12em;color:var(--berry);margin-bottom:2px}.pair:hover{border-color:var(--berry)}.prose{white-space:pre-wrap;line-height:2.15;overflow-wrap:anywhere}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.controls button{border:1px solid var(--rule);background:var(--paper);padding:8px 16px;color:var(--berry)}.controls button:disabled{opacity:.35;cursor:default}.empty{background:var(--paper);border:1px dashed var(--rule);padding:38px 24px;color:var(--muted)}footer{border-top:1px solid var(--rule);padding:24px 0;color:var(--muted);font-size:13px}@media(max-width:500px){main.wrap{padding-top:35px}.person{min-height:155px}}
body.null-volume{--cream:#111113;--paper:#1b1b1e;--berry:#e8e8ea;--ink:#f2f2f0;--muted:#8f9096;--rule:#34353a;color:var(--ink)}body.null-volume header{background:rgba(17,17,19,.97)}body.null-volume .lede,body.null-volume .person .desc{color:#b4b5ba}body.null-volume .person .thumb{background:linear-gradient(135deg,#2a2b30,#1b1b1e,#3a3b40)}body.null-volume .person .num{letter-spacing:.24em}.person .thumb.chibi{height:auto;aspect-ratio:1/1;background:#000}.person .thumb.chibi img{transition:transform .35s}.person:hover .thumb.chibi img{transform:scale(1.04)}.person .thumb.has-img{height:auto;aspect-ratio:4/5}.person .thumb.has-img img{object-position:center 22%}.volumes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px}.volume{display:flex;flex-direction:column;text-align:left;min-height:310px;padding:32px;border:1px solid var(--rule);background:var(--paper);transition:transform .2s}.volume:hover{transform:translateY(-4px);border-color:var(--berry)}.volume .cover-art{height:auto;aspect-ratio:4/5;object-fit:cover;display:block;margin:-32px -32px 22px;width:calc(100% + 64px);max-width:none;border-bottom:1px solid var(--rule)}.volume .cover-art.qc{object-position:85% center}.volume .cover-art.nl{object-position:center 22%}.volume .edition{font-size:12px;letter-spacing:.22em;color:var(--muted)}.volume strong{font-size:clamp(34px,5vw,56px);color:var(--berry);line-height:1.3;margin:24px 0 8px}.volume .summary{font-size:15px;line-height:1.8}.volume .enter{margin-top:auto;padding-top:16px;color:var(--berry)}.volume.null-cover{background:#141416;color:#d6d7db;border-color:#2c2d31}.volume.null-cover strong{color:#f2f2f0;letter-spacing:.08em}.volume.null-cover .enter{color:#f2f2f0}.volume.null-cover .edition{color:#8f9096}.volume.null-cover:hover{border-color:#d6d7db}.extra-link{margin-top:35px;color:var(--muted);font-size:14px}.extra-link button{background:none;border:0;border-bottom:1px solid currentColor;color:var(--berry)}@media(max-width:620px){.volumes{grid-template-columns:1fr}.volume{min-height:235px}}</style></head><body><header><div class="wrap head"><a class="logo" href="./index.html#home">岔頁 <small>OFF PAGE</small></a><a class="back" href="./index.html#home">返回首頁 ↗</a></div></header><main class="wrap" id="app"></main><footer><div class="wrap">OFF PAGE — by Xia mumu · CHARACTER ARCHIVE</div></footer><script>
/* 故事格式：{title:"標題",prompt:"故事提示語",content:"正文",date:"2026-11-11",cover:"images/cover.jpg",images:[{src:"images/scene.jpg",caption:"圖說"}]}。 */
const characters=[
{id:"wen",name:"聞止水",desc:"紀實攝影師｜棲川市",portrait:"images/qichuan/wen.webp",chibi:true,stories:[]},
{id:"xu",name:"徐汀云",desc:"犯罪學副教授｜棲川市",portrait:"images/qichuan/xu.webp",chibi:true,stories:[{"title": "人為什麼會走到那？", "cover": "images/stories/xu-why.webp", "prompt": "徐汀云為什麼選擇讀犯罪學？", "date": "2026-11-11", "content": "徐汀云第一次對「犯罪」產生興趣，並不是因為一樁驚天動地的案件。\n\n沒有血，沒有屍體，也沒有警笛劃破夜色。\n\n那年他十七歲。\n\n學校裡有個學生偷了同學的錢。\n\n數目不大，幾千塊。事情被發現後，辦公室裡擠滿了人。老師問他為什麼偷，男生始終低著頭，手指死死捏著制服褲縫。\n\n最後只說了一句。\n\n「因為我想要。」\n\n事情突然變得很簡單。\n\n偷竊、說謊、處分、道歉。\n\n大家得到了足以把事情收進抽屜裡的答案。\n\n只有徐汀云記得，那天下午放學時，他看見那個男生站在福利社外面。\n\n隔著玻璃，看了很久。\n\n他看著一排麵包，眼裡有渴望。\n\n徐汀云沒有走過去。\n\n十七歲的他還不懂自己究竟看見了什麼，只是第一次覺得——\n\n一個人的行為，和一個人的故事，似乎不是同一件事。\n\n後來聽同學說才知道，那個男生的父親失業了。\n\n但這也沒有讓偷竊突然變成正確的事。\n\n這才是最令徐汀云著迷的地方。\n\n世界並不會因為理解一個人，就必須原諒他。\n\n而一個人做錯了事，也不代表這個人的全部。\n\n—\n\n大學選系時，他在志願表前坐了一個晚上。\n\n父親經過房門，看見燈還亮著，敲了兩下。\n\n「還沒決定？」\n\n「嗯。」\n\n「慢慢想。」\n\n門又關上了。\n\n桌面散著心理學、社會學、法律與犯罪學的資料。\n\n徐汀云忽然想起那個站在福利社玻璃前的背影。\n\n他一直記得。\n\n不是因為同情。\n\n而是因為那是他第一次意識到，人並不是沿著一條筆直的線，突然成為所謂的「壞人」。\n\n有些事情開始得非常小。\n\n一次缺席。\n\n一句沒有人相信的話。\n\n一頓沒有吃到的晚餐。\n\n一個逐漸失去作用的家庭。\n\n一場長年累積的羞辱。\n\n也可能什麼都沒有。\n\n有些人擁有愛、教育與選擇，仍然選擇傷害別人。\n\n理解從來不是替任何人脫罪。\n\n理解只是拒絕用一句「他就是壞」結束思考。\n\n於是徐汀云填下了犯罪學。\n\n—\n\n後來很多人問過他。\n\n為什麼？\n\n因為案件很有趣嗎？\n\n因為喜歡推理？\n\n因為想知道殺人犯在想什麼？\n\n每次聽見這些問題，他通常只是推一下眼鏡。\n\n「沒有那麼戲劇化。」\n\n他研究的東西其實很無聊。\n\n統計、訪談、犯罪史、社會結構、風險因子、行為模式。\n\n無數份資料。\n\n無數個不能被漂亮故事概括的人。\n\n他越研究犯罪，反而越不相信那些簡單的答案。\n\n他不相信一個眼神能證明誰天生邪惡，不相信童年創傷必然製造罪犯，也不相信理解犯罪者就等於背叛受害者。\n\n犯罪學教給他的，甚至不是如何看穿人。\n\n而是如何在想下結論的時候，再多等一下。\n\n證據夠了嗎？\n\n還有什麼沒有看見？\n\n我們正在解釋一個人的行為，還是只是在替自己的恐懼尋找一個方便的名字？\n\n—\n\n很多年後，徐汀云站上講台。\n\n投影幕停在一張犯罪統計圖表。\n\n底下有學生問：\n\n「老師，你研究這麼久，會覺得人性本惡嗎？」\n\n教室安靜下來。\n\n徐汀云沒有立刻回答。\n\n午後的光穿過百葉窗，在他的襯衫上切出一道一道淡白的影子。\n\n他忽然又想起十七歲那年。\n\n那片福利社的玻璃。\n\n那排麵包。\n\n還有一個他始終沒有走過去詢問的少年。\n\n片刻後，他把遙控器放到桌上。\n\n「我不知道。」\n\n學生似乎有些意外。\n\n徐汀云卻很平靜。\n\n「但我知道，當我們開始覺得自己已經完全理解一個人的時候，通常就是最容易看錯他的時候。」\n\n他轉身，在黑板上寫下一行字。\n\n理解不是赦免。\n\n停了一會兒，又在下面寫：\n\n但不理解，也不會讓正義變得更準確。\n\n粉筆落回凹槽。\n\n十七歲那年沒有得到答案的問題，最後成了他研究了半輩子的事。\n\n他選擇犯罪學，從來不是因為迷戀黑暗。\n\n恰恰相反。\n\n他只是想知道，一個人究竟經過了多少地方，才終於走到了那裡。"}, {"title": "沒有逃跑的人", "prompt": "徐汀云印象最深刻的案子", "date": "2026-11-11", "content": "徐汀云二十九歲那年，第一次以犯罪行為分析顧問的身分接觸重大案件。\n\n死者是一名四十二歲女性。\n\n凌晨兩點，被發現死在自己經營的小型洗衣店後方倉庫。\n\n沒有明顯闖入痕跡。\n\n監視器拍到最後一個進入店裡的人，是她二十三歲的兒子。\n\n而那個兒子，有前科。\n\n少年時期傷害、竊盜，成年後又因為鬥毆被判過刑。\n\n鄰居說母子經常吵架。\n\n案發前一天，甚至有人聽見他在門口大喊：\n\n「妳最好不要逼我。」\n\n故事幾乎自己寫完了。\n\n有暴力前科的兒子。\n\n長期衝突的母親。\n\n深夜。\n\n爭吵。\n\n死亡。\n\n警方找到他時，他就坐在離洗衣店不到五百公尺的便利商店裡。\n\n衣服上甚至有母親的血。\n\n他沒有逃。\n\n也沒有替自己辯解。\n\n問什麼，他都只是回答：「不知道。」\n\n徐汀云第一次看完整份訊問紀錄時，卻在其中一句話上停了很久。\n\n警方問：\n\n「你離開的時候，你媽還活著嗎？」\n\n男人回答：\n\n「她叫我記得帶傘。」\n\n只有這一句。\n\n之後無論怎麼問，他都不再提母親。\n\n—\n\n所有人都在研究他的憤怒。\n\n徐汀云卻開始研究他的「正常」。\n\n他調了過去幾個月能取得的紀錄。\n\n那個所有人口中脾氣暴躁、和母親關係惡劣的兒子，每個星期三都會出現在洗衣店。\n\n不是為了拿錢。\n\n他在搬洗衣精。\n\n母親腰不好，他負責把貨從一樓搬進倉庫。\n\n兩個人確實常常吵架。\n\n卻也固定一起吃晚餐。\n\n案發當晚那句「妳最好不要逼我」，後面其實還有一句沒有被最初的目擊描述完整保留下來——\n\n「妳最好不要逼我明天帶妳去看醫生。」\n\n而這是徐汀云之後問出來的。\n\n徐汀云沒有因此認定他無罪。\n\n他只是在會議裡說：「我們現在有很多證據證明他很容易生氣。」\n\n他把資料闔上。\n\n「但容易生氣，和殺人，是兩件事。」\n\n—\n\n後來真正改變偵查方向的，不是什麼天才式側寫。\n\n是一張被忽略的送貨紀錄。\n\n以及倉庫後方一道平時幾乎不用的維修門。\n\n真正的嫌疑人與死者存在金錢糾紛，熟悉店內格局，也知道監視器的位置。\n\n兒子案發時確實進過倉庫。\n\n衣服上有血是因為他發現母親倒在地上時，曾經試圖把她抱起來。\n\n可他有前科。\n\n他知道自己會成為第一個被懷疑的人。\n\n所以他恐懼、混亂，最後什麼都不肯說。\n\n案件結束後，有人問徐汀云是不是很有成就感。\n\n他沒有回答。\n\n因為他始終記得那個男人離開時的樣子。\n\n沒有道謝。\n\n沒有如釋重負。\n\n只是站在警局外面很久，最後忽然問：\n\n「徐老師。」\n\n「嗯？」\n\n「如果我以前沒有做過那些事，他們是不是就會早一點相信我？」\n\n徐汀云沉默了很久。\n\n他不能騙他。\n\n「可能。」\n\n男人點點頭。\n\n走了。\n\n—\n\n後來徐汀云上課偶爾會提到這個案例。\n\n他從不把自己說成破解案件的人。\n\n甚至會刻意告訴學生：\n\n「我當時也不知道他是不是兇手。」\n\n他只是做了一件事。\n\n沒有因為一個人的過去太符合答案，就停止尋找其他答案。\n\n這件案子成為徐汀云職業生涯裡非常重要的一條原則：\n\n「側寫不是告訴你誰是兇手。」\n\n「它更重要的用途，有時候是提醒你——你是不是太希望某個人就是兇手。」\n\n很多年後，他仍然記得那句「她叫我記得帶傘」。\n\n因為這句話提醒了他：\n\n一個人可以曾經傷害別人，可以暴躁、說謊、犯過罪，也可以同時記得星期三替母親搬洗衣精。\n\n人永遠比一份卷宗，多一點。"}, {"title": "游未遲這個人", "prompt": "徐汀云跟游未遲", "pair": "you/2", "date": "2026-11-11", "content": "徐汀云第一次注意到游未遲，是因為他遲到了十二分鐘。\n\n不是十，也不是十五。\n\n是十二。\n\n那時徐汀云坐在研究所教室靠窗第一排，筆記寫到第三頁。教授正在談犯罪行為研究裡的歸因偏誤，後門忽然被推開，一個頭髮亂得像剛跟枕頭打完架的男人走進來。\n\n左手咖啡，右手背包。\n\n沒有因為遲到而顯得慌張。\n\n甚至還有空停在門口看一眼哪裡有位置。\n\n徐汀云只看了他兩秒。\n\n便在心裡完成判斷。\n\n——時間管理很差。\n\n那大概是他對游未遲做過最準確，也最沒有用的一次分析。\n\n因為游未遲根本不在乎。\n\n—\n\n真正說上話，是那堂跨領域課程。\n\n教授給了一個資訊殘缺的案例，讓所有人推測當事人的行為動機。\n\n教室裡很熱鬧。\n\n每個人都急著把缺失的部分填滿。\n\n但徐汀云沒有。\n\n教授點到他時，他只說：\n\n「現有資訊不足。」\n\n「所以你的答案是不知道？」\n\n「對。」\n\n他甚至不覺得這句話有什麼特殊。\n\n不知道就是不知道。\n\n可是下課後，那個遲到十二分鐘的人走到他桌邊。\n\n「欸。」\n\n徐汀云抬頭。\n\n「你剛剛那句不錯。」\n\n「哪一句？」\n\n「不知道就是不知道。」\n\n徐汀云看了他一眼。\n\n「這不是一句很值得稱讚的話。」\n\n游未遲咬著咖啡吸管。\n\n「是嗎？」\n\n他笑了一下。\n\n「現在很多人不會。」\n\n—\n\n徐汀云其實不太明白自己為什麼會和游未遲成為朋友。\n\n按照他的習慣，他應該不喜歡這種人。\n\n游未遲會遲到。\n\n會忘記回訊息。\n\n會把穿過但還不打算洗的衣服堆在椅背上，並一本正經地稱之為「常用區」。\n\n徐汀云對著雜亂的房間沈默，用慣用的毒舌嘲諷游未遲的散漫，游未遲卻笑了：「你講話很傷人欸，徐大教授。」\n\n徐汀云以為這只是一句隨口的稱呼。\n\n結果這四個字跟了他很多年。\n\n研究所畢業、任教、升等、成為副教授。\n\n游未遲還是叫他徐大教授。\n\n徐汀云糾正過。\n\n兩次。\n\n第三次以後就放棄了。\n\n—\n\n他們後來走進完全不同的領域。\n\n游未遲選擇法醫。\n\n徐汀云留在犯罪學。\n\n一個閱讀活著的人留下的選擇，一個閱讀死亡之後留在身體的證據。\n\n他們都靠近死亡，卻從不同方向靠近。\n\n徐汀云知道游未遲討厭猜，他也是，所以他從不在案件上問游未遲「你覺得呢？」\n\n在一個人人都急著得到答案的世界裡，他們始終對彼此保留說「不知道」的權利。\n\n就像很多年前的那間教室。\n\n—\n\n他們也曾經吵得很難看。\n\n徐汀云知道游未遲的「沒事」有問題。\n\n所以他問。\n\n問睡眠、問工作、問他是不是又把自己的狀況拖到不能再拖。\n\n問題一個接一個。\n\n直到游未遲忽然叫他：\n\n「徐汀云。」\n\n沒有徐大教授。\n\n徐汀云便停了。\n\n他知道游未遲只有真的生氣時才會完整叫他的名字。\n\n「我現在不需要你理解我。」\n\n那句話讓他沉默。\n\n因為很久以前，也有人對他說過相似的話。\n\n游未遲靠著牆，閉上眼睛。\n\n「坐著就好。」\n\n於是徐汀云真的坐下。\n\n拉開旁邊的椅子，坐下來看自己的論文。\n\n後來游未遲睡著了。\n\n徐汀云替他倒了一杯水。\n\n把冷氣調高一度。\n\n繼續看。\n\n一個多小時後，游未遲醒來。\n\n「你還沒走？」\n\n徐汀云頭也沒抬。\n\n「你不是叫我坐著？」\n\n游未遲看了他很久。\n\n最後笑了一聲。\n\n「哦。」\n\n徐汀云沒有笑。\n\n只是翻了一頁。\n\n可他知道。\n\n這一次，他大概做對了。\n\n—\n\n如果有人問徐汀云，游未遲是什麼？\n\n徐汀云大概不會回答摯友或朋友。\n\n他只會說：\n\n「研究所認識的。」\n\n然後補一句：\n\n「很久了。」\n\n這已經是他能給出的，非常重的一句話。\n\n因為所謂很久，是游未遲知道他喝黑咖啡，知道他真正動怒時反而會變得異常客氣，知道他不說話不一定是不高興，也可能只是累了。\n\n而徐汀云知道游未遲冰箱裡通常沒有能稱作正餐的東西。\n\n知道他值完班會懶得吃飯。\n\n知道他說「還好」時不能一概而論。\n\n一種是真的沒事、一種是累、一種是不想說、還有一種是——\n\n你不要問，但可以留下來。\n\n他花了很多年才學會辨認最後一種。\n—\n\n他們從來沒有承諾過永遠。\n\n徐汀云也不需要。\n\n游未遲搬家時，他會去。\n\n生病時，他會把藥放在桌上。\n\n凌晨收到一句「活著嗎」，只要醒著，大多會回。\n\n有時候三四天沒有任何訊息。\n\n第五天，游未遲突然傳：「吃飯？」\n\n徐汀云會回：「幾點？」\n\n他們沒有刻意維持什麼。\n\n也沒有反覆確認彼此是不是仍然重要。\n\n他們的關係像城市裡走了很多年的路。\n\n平時不會特別注意，直到某一天雨下得很大，世界突然變得有點難走。\n\n你才發現自己根本不用費心注意腳下。\n\n在徐汀云那個習慣觀察、推論、尋找因果的人生裡，游未遲大概就是少數不需要被解釋的存在。\n\n他不需要預測這段友誼，他只知道——\n\n這麼多年，每當他偶爾回頭，那個遲到了十二分鐘的人，依然懶散、依然衣服穿反，也依然在。"}, {"title": "林晏洄這個人", "cover": "images/stories/trio.webp", "prompt": "徐汀云和林晏洄", "date": "2026-11-11", "content": "徐汀云第一次見到林晏洄，就不太喜歡他。\n至少他當時是這麼判斷的。\n那是一場聚會，徐汀云到得很準時。\n林晏洄遲到了二十七分鐘。 \n沈茉已經結婚了。\n\n她手上戴著戒指，懷裡抱著幾本書，還是會把其中一本拿反。\n\n徐汀云看了一眼。\n\n沒有提醒。\n\n她自己先笑了。\n\n「你變了欸。」\n\n「哪裡？」\n\n「以前你一定會叫我轉過來。」\n\n徐汀云低頭笑了一下。\n\n「拿反又不影響妳抱著。」\n\n他們聊了幾分鐘。\n\n沒有遺憾的告白，也沒有多年後才發現彼此仍然相愛。\n\n只是兩個曾經非常靠近的人，在漫長的人生裡又碰巧經過彼此一次。\n\n離開前，沈茉忽然叫住他。\n\n「徐汀云。」\n\n「嗯？」\n\n「你現在還會一直分析喜歡的人嗎？」\n\n他沉默了一會兒。\n\n「會。」\n\n她笑出聲。\n\n「果然。」\n\n「但現在會先問。」\n\n「問什麼？」\n\n徐汀云想了想。\n\n「妳現在是想要我幫妳想辦法，還是只要我陪妳？」\n\n沈茉望著他。\n\n然後很輕地笑了。\n\n「這樣很好。」"}]},
{id:"you",name:"游未遲",desc:"法醫｜棲川市",portrait:"images/qichuan/you.webp",chibi:true,stories:[{"title": "離開的方式", "prompt": "為什麼游未遲成為法醫？", "date": "2026-11-11", "content": "那年游未遲十七歲。\n\n某個普通的下午，他趴在家裡餐桌上寫作業。窗外曬著母親洗好的床單，風一吹，白色布料鼓起來，又慢慢落下。\n\n電視裡正在播一則新聞。\n\n有人死了。\n\n主播用了很短的時間說完那個人的一生——姓名、年齡、死亡地點，以及一句尚待釐清的死因。\n\n下一則新聞開始。\n\n游未遲握著筆，看著畫面切走，忽然問父親：\n\n「如果死人不會說話，那要怎麼知道他的死因？」\n\n父親低頭看報紙，只回了一句。\n\n「總有人負責弄清楚。」\n\n他哦了一聲。\n\n沒有再問。\n\n⸻\n\n游未遲不是對死亡充滿浪漫想像的人。\n\n相反地，他很討厭別人把死亡說得太漂亮。\n\n死亡沒有電影裡那麼乾淨。\n\n它不總是在一個人說完最後一句重要的話以後才來，也不會體貼地替所有關係留下告別的時間。\n\n有時候只是早餐還剩半杯。\n\n手機裡有一封沒有回覆的訊息。\n\n冰箱裡的牛奶明天才過期。\n\n衣服晾在陽台。\n\n明明所有東西都還維持著「這個人明天會回來」的樣子，可是那個人不回來了。\n\n他後來讀醫學，第一次接近死亡時，才發現自己沒有想像中害怕。\n\n但他也沒有興奮。\n\n他只是突然變得很安靜。\n\n那是一個曾經活過的人。\n\n不是題目。\n\n不是教材。\n\n更不是讓誰證明自己聰明的謎。\n\n他清楚地意識到，死亡之所以沉默，不是因為它沒有留下任何東西。\n\n它留下得太多了。\n\n傷口的位置、骨頭的裂痕、血液留下的痕跡、疾病走過器官的方式。\n\n身體其實一直在說話。\n\n只是它使用的語言，很少有人學得會。\n\n所以他想學。\n\n不是為了成為那種一眼就能破解真相的人。\n\n游未遲不相信世界上有那種人。\n\n他知道人會犯錯，醫學會有極限，證據也可能只能把答案帶到某個範圍，而不是一個漂亮的句點。\n\n他學會的第一件事，反而是承認：\n\n不知道。\n\n不能確定。\n\n目前只能判斷到這裡。\n\n對游未遲而言，這些話從來不是無能。\n\n是誠實。\n\n活著的人已經太容易替死去的人說話了。\n\n「他一定是……」\n\n「她應該有……」\n\n「如果當時……」\n\n每個人都急著替一段已經無法反駁的人生補上解釋。\n\n可他不想。\n\n他只願意說證據允許他說的部分。\n\n剩下的，就留白。\n\n那大概是他能給一個陌生人最後的尊重。\n\n⸻\n\n有人問過他，天天面對死亡，不會覺得人生很灰嗎？\n\n游未遲當時正在喝咖啡。\n\n他想了很久。\n\n「不會啊。」\n\n對方很意外。\n\n他低頭轉了一下紙杯，懶洋洋地補了一句：\n\n「就是因為看太多了，才覺得活著的人不要浪費時間。」\n\n所以他很少真的跟誰冷戰。\n\n不喜歡就說不喜歡。\n\n想見一個人，有時候就傳一句「吃飯？」\n\n喜歡了，或許會臉紅，會結巴，會被一句直球弄得半天講不出話。\n\n但最後還是會說。\n\n因為他比很多人更清楚——\n\n不是每一句「下次再說」，都真的有下一次。\n\n他漸漸明白，生命真正殘忍的地方，是沒有人知道什麼時候會結束。\n\n於是他仍舊懶洋洋地活。\n\n休假睡到下午，衣服丟在椅背，咖啡喝得太多，訊息想起來才回。被朋友罵沒有生活規律，他也只是靠在沙發上，半閉著眼睛說：\n\n「還活著啊。」\n\n好像什麼都不在乎。\n\n但真正重要的事情，他一次也沒有隨便。\n\n因為他每天面對的，都是一些再也沒有機會回頭的人。\n\n他成為法醫，是因為他知道——\n\n死亡已經拿走了一個人的聲音，就不該再被拿走屬於他的真相。\n\n而游未遲願意做那個站在沉默旁邊的人。\n\n低下頭，耐心地把一個人最後留下的痕跡，一點、一點地讀完。\n\n然後盡力替他說清楚離開的方式。"}, {"title": "阿黑", "cover": "images/stories/you-ahei.webp", "prompt": "阿黑ㄉ故事", "date": "2026-11-11", "content": "游未遲沒有打算飼養任何生物。\n\n畢竟他連自己都養得很隨便。\n\n休假能睡到下午，冰箱有時候只剩咖啡、雞蛋和母親硬塞進去的食物，衣服能在椅背上掛三天，只要都還找得到，那就不叫亂。\n\n所以當陳紹安問他要不要養貓時，他連頭都沒抬。\n\n「不要。」\n\n「我還沒說哪一隻。」\n\n「哪一隻都不要。」\n\n「黑的。」\n\n「顏色不影響答案。」\n\n陳紹安在附近的停車場發現了一隻流浪幼貓。\n\n很小，黑得不太均勻，耳朵大得像還沒長好，躲在車底下不肯出來。有人放了水和罐頭，牠餓得厲害，卻還是等所有人退遠以後才敢靠近。\n\n寒冷的冬天，雨下了一整晚。\n\n第二天早上，牠還在。\n\n游未遲蹲在車旁看了牠很久。\n\n小黑貓縮在輪胎後面，濕漉漉的，警戒地瞪著他。\n\n他伸手。\n\n牠哈氣。\n\n「哦。」\n\n他把手收回來。\n\n「脾氣還挺大。」\n\n最後他只是把外套脫下來，墊在紙箱裡，再把紙箱往車底推了一點。\n\n本來只打算這樣。\n\n可是那天下班，他走到停車場，看見那團黑色的，還縮在自己外套上的生物。\n\n外套大概報廢了。\n\n貓也沒有要走。\n\n游未遲站在原地沉默半分鐘。\n\n「……你最好不要是故意的。」\n\n貓當然沒有回答。\n\n那天晚上，他提著一個裝貓的紙箱回家。\n\n⸻\n\n一開始只是「暫住」。\n\n他帶牠檢查、驅蟲、打疫苗，買最基本的貓砂盆和飼料。\n\n寵物用品店的人問：「貓叫什麼名字？」\n\n游未遲低頭。\n\n紙箱裡一雙黃綠色的眼睛正看著他。\n\n「阿黑。」\n\n店員安靜兩秒。\n\n「……很直觀。」\n\n「謝謝。」\n\n他根本沒有認真取名。\n\n他一直覺得，等阿黑身體養好了，也許會替牠找個更適合的家。\n\n所以不用取太正式。\n\n不用買太多東西。\n\n不用習慣。\n\n結果第三天，他買了貓抓板。\n\n第五天，窗邊多了一個貓窩。\n\n第二週，他嫌原本的飼料成分不好，換了一包更貴的。\n\n一個月後，徐汀云站在他家客廳，看著佔據整面窗戶的貓跳台，沉默片刻。\n\n「你不是說暫時？」\n\n游未遲躺在沙發上，阿黑趴在他胸口。\n\n「嗯。」\n\n「這是暫時？」\n\n「牠還沒提出搬家的日期。」\n\n徐汀云看了他一眼。\n\n「你可以承認你想養。」\n\n「沒必要。」\n\n「為什麼？」\n\n游未遲閉上眼睛，手指有一下沒一下地摸著阿黑的後腦。\n\n「麻煩。」\n\n阿黑呼嚕得很大聲。\n\n徐汀云沒有拆穿他。\n\n⸻\n\n其實阿黑很像他。\n\n不喜歡被強迫抱。\n\n不高興會走。\n\n想親近的時候又會自己過來。\n\n大部分時間各過各的，卻總喜歡待在同一個空間。\n\n游未遲看書，阿黑睡在旁邊。\n\n他洗澡，阿黑蹲在浴室門口。\n\n他凌晨回家，玄關永遠有一雙黃綠色的眼睛，在黑暗裡安靜地等著。\n\n游未遲從來沒有教牠等。\n\n就像阿黑也沒有要求他一定要回來。\n\n他們只是慢慢習慣了彼此存在。\n\n如果有人問他為什麼會養阿黑，他通常回答：\n\n「撿到的。」\n\n再問：\n\n「那為什麼沒送養？」\n\n他就會沉默一下。\n\n「忘了。」\n\n像這件事情真的只是一場拖延太久的意外。\n\n可只有游未遲自己知道——\n\n一天凌晨，他結束工作回家，累得連燈都不想開。\n\n門才剛關上，一團溫熱的黑色身影便從客廳跑過來，在他的腳踝蹭了一圈。\n\n他蹲下來摸了摸阿黑。\n\n忽然覺得，一間原本只是拿來睡覺的房子，好像從某一天開始，變成了有人等他回去的地方。\n\n他沒有對任何人說。\n\n只是第二天下班，又買了一箱阿黑喜歡的罐頭。\n\n游未遲的人生裡，很多重要的東西大概都是這樣留下來的。\n\n沒有盛大的決定。\n\n沒有宣言。\n\n甚至一開始還嫌麻煩。\n\n只是某個人、某隻貓，在他身邊待得久了一點。\n\n他往旁邊挪了一點位置。\n\n然後就再也沒有收回去。\n\n阿黑不是他決定養的貓。\n\n是某個下雨的晚上，他把一個小生命帶回家；後來才發現，那個小生命也替他守住了一盞回家的燈。"}, {"title": "徐汀云這個人", "cover": "images/stories/you-xu-birthday.webp", "images": ["images/stories/trio.webp"], "prompt": "游未遲和徐汀云", "pair": "xu/2", "date": "2026-11-11", "content": "游未遲認識徐汀云，是在研究所時。\n\n徐汀云坐在靠窗第一排，黑色短髮梳得乾淨，細框眼鏡後的眼睛低垂著，在教授講話時一行一行寫筆記。\n\n游未遲遲到了十二分鐘。\n\n他從後門進來，頭髮亂著，咖啡拿在手裡，找了最後一排的位置坐下。\n\n兩個人的個性天差地遠，像兩條平行線不該交匯。\n\n一個做什麼都提前排好順序。\n\n一個活得像「沒死就行」。\n\n真正說上話，是因為一堂跨領域課程。\n\n教授丟出一個案例，問學生怎麼看。\n\n教室裡很快出現許多答案。\n\n但徐汀云一直沒有說話。\n\n直到教授點他。\n\n他推了一下眼鏡。\n\n「現有資訊不足。」\n\n全班安靜了一瞬。\n\n教授問：「所以你的答案是不知道？」\n\n「對。」\n\n徐汀云語氣很平。\n\n「不知道就是不知道。資料不足的時候，補得越完整，只是故事寫得好，不代表接近事實。」\n\n坐在後面的游未遲抬起了頭。\n\n下課後，他經過徐汀云旁邊忽然停下。\n\n「欸。」\n\n徐汀云抬眼。\n\n「你剛剛那句不錯。」\n\n「哪一句？」\n\n「不知道就是不知道。」\n\n徐汀云看著他。\n\n「這不是一句很值得稱讚的話。」\n\n游未遲咬著吸管。\n\n「是嗎？現在很多人不會。」\n\n那就是他們友誼的開始。\n\n⸻\n\n後來他們的走向完全不同。\n\n徐汀云研究犯罪學、行為與人在選擇之前留下的軌跡。\n\n游未遲進入法醫領域，學習辨認一具身體在生命最後留下的證據。\n\n徐汀云問：一個人為什麼這樣做？\n\n游未遲回答的是：這個人的身體發生了什麼？\n\n他們從不把彼此的專業混在一起。\n\n徐汀云不會站在解剖室裡假裝自己看得懂病理。\n\n游未遲也不會因為看過幾份案件資料，就分析犯罪心理。\n\n有時候徐汀云問：「這個傷能判斷形成方式嗎？」\n\n游未遲說：「可以。」\n\n有時候說：「不能。」\n\n徐汀云從不追問他「那猜呢？」\n\n因為他知道，游未遲最討厭猜。\n\n反過來也是。\n\n⸻\n\n私底下就沒有那麼客氣了。\n\n徐汀云第一次去游未遲家，看見椅背上的三件衣服。\n\n「你沒有衣櫃？」\n\n「有啊。」\n\n「那這是什麼？」\n\n「常用區。」\n\n「地板那件呢？」\n\n游未遲低頭看了一眼。\n\n「待處理區。」\n\n徐汀云沉默。\n\n「垃圾桶呢？」\n\n「你講話很傷人欸，徐大教授。」\n\n後來「徐大教授」就這麼定下來了。\n\n這個綽號在游未遲的通訊錄裡待了很多年。\n\n⸻\n\n他們不是每天聯絡的朋友。\n\n各自忙工作，開會、處理自己的人生。\n\n但在某天凌晨，徐汀云的手機會亮起。\n\n💬 游未遲：「活著嗎」\n\n徐汀云通常過幾分鐘才回。\n\n💬 徐汀云：「有事？」\n\n💬 游未遲：「沒事。」\n\n💬 游未遲：「吃宵夜？」\n\n他們認識太久，很多話不需明說。\n\n徐汀云如果突然出現在樓下，游未遲也不會問他是不是心情不好。\n\n只是把安全帽丟過去，或者推開副駕上的東西。\n\n「上車。」\n\n等徐汀云坐好，再補一句。\n\n「你今天看起來比屍體難聊。」\n\n「你的職業笑話很無聊。」\n\n「你還是有回我。」\n\n然後開車。\n\n有些陪伴不需要被命名。\n\n⸻\n\n他們當然也吵過。\n\n而且吵起來不好看。\n\n徐汀云太習慣理解問題。\n\n游未遲太習慣自己處理問題。\n\n一個會問。\n\n一個會說沒事。\n\n徐汀云最討厭游未遲明明累到不行還說「還好」。\n\n游未遲最討厭徐汀云偶爾把關心做成分析。\n\n有一次他終於打斷他。\n\n「徐汀云。」\n\n不是徐大教授。\n\n徐汀云停下來。\n\n游未遲靠著牆，眼底全是值班後的疲憊。\n\n「我現在不需要你理解我。」\n\n「……」\n\n「坐著就好。」\n\n那天徐汀云真的沒有再問。\n\n只是坐下。\n\n後來游未遲睡著了。\n\n醒來時，桌上多了一杯水。\n\n徐汀云還坐在旁邊看論文。\n\n一句話都沒有。\n\n游未遲盯著他看了一會兒。\n\n「你還沒走？」\n\n徐汀云頭也沒抬。\n\n「你不是叫我坐著？」\n\n游未遲笑了。\n\n「哦。」\n\n很輕的一聲。\n\n卻大概是他們認識那麼多年裡，最接近「謝謝」的一次。\n\n⸻\n\n他們從來不對彼此說「永遠」。\n\n那個詞太大，也太容易說。\n\n他們只是會在對方搬家的時候出現。\n\n生病時送藥。\n\n失戀時陪喝酒。\n\n互相嫌棄。\n\n偶爾三天不聯絡，第四天又像什麼都沒有發生一樣問：「吃飯？」\n\n如果有人問游未遲：徐汀云對他而言算什麼？\n\n他不會說摯友，也不會說知己。\n\n那些詞太正式。\n\n他只會想一下，然後懶洋洋地回答：\n\n「徐汀云哦？認識很久了。」\n\n好像也沒什麼。\n\n可所謂很久，其實是——\n\n他知道徐汀云喝什麼咖啡，知道他真正生氣時反而更安靜，知道他什麼時候只是需要有人陪著，什麼時候是真的想一個人。\n\n徐汀云也知道他說「沒事」有好幾種意思。\n\n知道哪一種是真的沒事。\n\n哪一種是累。\n\n哪一種是逞強。\n\n哪一種是最好不要問，只要留下來。\n\n他們從來沒有刻意成為彼此人生裡重要的人。\n\n只是一起走過很多年。\n\n走著走著，回頭才發現——每一次 話。」\n林晏洄笑了。\n「你害羞哦？」\n「沒有。」\n「耳朵紅了。」\n「冷氣太熱。」\n「冷氣太熱是什麼東西？」\n「閉嘴。」\n林晏洄笑了一路。\n從那之後，他們好像就真的成了朋友。\n\n⸻\n\n他們的相處是這樣：一個惹事、一個看戲。\n最重要的－－一起惹徐汀云。\n如果有人問游未遲，他跟林晏洄怎麼變熟的。\n他會皺著眉想很久。\n然後回答：「徐汀云害的。」\n林晏洄會在旁邊抗議：「明明是你自己捨不得我。」\n游未遲看他一眼。\n「嗯。」\n林晏洄反而愣住。\n「……蛤？」\n游未遲已經低頭繼續滑手機。\n嘴角有一點很淡的笑。\n「沒事。」"}]},

{id:"lin",name:"林晏洄",desc:"環保顧問｜棲川市",portrait:"images/qichuan/lin.webp",chibi:true,stories:[{"title": "洄", "cover": "images/stories/lin-hui.webp", "prompt": "林潤和林晏洄", "date": "2026-11-11", "content": "二十五歲那年，林晏洄已經愛了當時的女朋友四年。\n\n四年很長。\n\n長到足以讓兩個人的牙刷在同一個杯子裡站穩，長到朋友們不再問「你們還在一起嗎？」，改成問：「所以你們什麼時候結婚？」\n\n愛情走得很久，久得好像應該抵達某處。\n\n好像一條河最後應該流進一片海。\n\n所有人都是這樣告訴他的。\n\n可是晏洄漸漸發現——\n\n他還在看別的風景。\n\n不是因為不愛她。\n\n恰恰因為仍然愛，所以這件事才如此難以解釋。\n\n他會在回家的路上想念她，也會在某個陌生人的眼睛裡突然停留；會記得她生理期不喝冰的，也會想知道另一個人的童年、傷口、喜歡什麼樣的凌晨。\n\n愛沒有減少。\n\n只是流向增加了。\n\n他第一次提出「開放式關係」時，她哭著問：「有我還不夠嗎？」\n\n那句話後來在他身體裡住了很久。\n\n不夠。\n\n多殘忍的兩個字。\n\n所以他沒有說。\n\n他只是想——\n\n為什麼人們總把愛想像成唯一的缺口？\n\n一個人進來了，就沒有位置給另一個人。\n\n可如果愛是一條河呢？\n\n林潤是在那時候出現的。\n\n自由、熱烈，笑起來毫不收斂。她不是晏洄熟悉的那種精緻克制，反而有種奇怪的生命力，彷彿走到哪裡，那裡的空氣就會跟著流動。\n\n林潤就是那樣的人。\n\n她笑得很大聲，喜歡就說喜歡，不喜歡也不裝。她身上有一種晏洄很羨慕的東西——\n\n不需要證明自己「有資格」就能獲得的絕對自由。\n\n她知道他有女朋友。\n\n所以第一次察覺兩人之間那點不太尋常的東西時，林潤沒有討要承諾，她只是輕輕的問：\n\n「你快樂嗎？」\n\n晏洄愣了一下。\n\n\n「你現在這樣，快樂嗎？」\n\n……\n\n他答不出來。\n\n後來他們在很多夜晚深談。\n\n有些談愛、談責任、談那些成年人很喜歡使用、卻很少有人真的拆開來看的詞。\n\n「應該。」\n\n「穩定。」\n\n「負責。」\n\n「一輩子。」\n\n晏洄說：「我媽很喜歡說，人就應該怎樣。」\n\n林潤問：「那你呢？」\n\n「我什麼？」\n\n「你想怎樣？」\n\n又是沉默。\n\n林潤好像很擅長把問題丟進水裡。\n\n不撈。\n\n就任由它沉下去。\n\n她從不急著得到答案。\n\n有一次晏洄問她：\n\n「如果我最後沒有離開她呢？」\n\n林潤正在喝飲料。\n\n她甚至沒有停下來。\n\n「那就不要離開啊。」\n\n「……就這樣？」\n\n「不然呢？」\n\n「妳不會難過？」\n\n林潤終於抬起眼。\n\n「會。」\n\n很乾脆。\n\n沒有故作灑脫。\n\n沒有偉大的成全。\n\n「可是晏洄。」\n\n她說。\n\n「我的難過，是我的。」\n\n「不能拿來替你決定人生。」\n\n那一天沒有發生任何浪漫的事。\n\n沒有接吻。\n\n沒有擁抱。\n\n甚至沒有誰碰誰的手。\n\n可多年以後，晏洄仍然記得那一刻。\n\n因為那是第一次——\n\n有人明明可以用愛拉住他，卻鬆開了手。\n\n河流忽然不知道該往哪裡逃了。\n\n最後他還是選擇分手。\n\n四年的感情沒有在那一天突然變成錯誤。\n\n他們甚至哭了。\n\n他抱著那個陪他從大學走到成人世界的女人，第一次不再試圖說服她接受自己的愛。\n\n那一刻他終於明白：\n\n自由不是「妳應該接受真正的我」。\n\n自由也包括——\n\n她可以不要。\n\n她可以想要唯一。\n\n而他可以做不到。\n\n沒有誰比較進步。\n\n沒有誰比較懂愛。\n\n只是兩個曾經一起走了很遠的人，終於承認前面的河道分岔。\n\n所以鬆手。\n\n分手之後，晏洄消失了一陣子。\n\n林潤沒有找他。\n\n更沒有站在終點等著領取一個名為「勝利」的男人。\n\n她去上班、吃飯、跟朋友出去、過她自己的生活。\n\n就像林晏洄做出的重大決定，從來不是她人生的主線。\n\n然後某天下午，她的手機亮了。\n\n晏洄：小恐龍。\n\n林潤盯著那三個字。\n\n林潤：？\n\n晏洄：我單身了。\n\n過了半分鐘。\n\n又一則。\n\n晏洄：先說，不是為了妳。\n\n林潤笑了。\n\n林潤：喔。\n\n又過了一分鐘。\n\n晏洄：但是。\n\n很久。\n\n久到林潤幾乎可以想像，那個平常說話漂亮得滴水不漏的人，正對著輸入框刪刪改改。\n\n最後只有一句。\n\n晏洄：既然現在是我自己的選擇了，我可以追妳嗎？\n\n很多年以後，晏洄仍然不覺得林潤「改變了他」。\n\n林潤沒有教會他怎麼愛。\n\n沒有拯救他。\n\n更沒有把一個迷途的人領回正確的岸。\n\n她只是坐在一條混亂的河旁邊，不築壩、不改道、不拿著地圖告訴它——\n\n你應該流向這裡。\n\n她只是問：「你想去哪裡？」\n\n然後等。\n\n等那條河第一次不為任何人的期待、不為責任、不為愧疚，也不為害怕失去誰——\n\n自己選擇方向。\n\n所以後來林晏洄仍然愛很多人。\n\n仍然遠行。\n\n仍然對陌生的靈魂心動。\n\n林潤也從來沒有成為他的岸。\n\n岸意味著界線、意味著河水到這裡為止。\n\n她比較像水域。\n\n只是每當晏洄流經那裡，水會忽然慢下來。\n\n不是被攔住，只是想停一下。\n\n再久一點。\n\n再久一點。\n\n直到有一天，他後知後覺地發現——\n\n所謂的「留下」，從來不是河流停止流動。\n\n而是世界那麼大，水域那麼多，他仍然一次又一次、自由地、流回她身邊。"}, {"title": "小蝰", "cover": "images/stories/lin-xiaokui.webp", "prompt": "林晏洄為什麼被叫小蝰？", "date": "2026-11-11", "content": "「我覺得你很像史萊哲林的學生。」\n\n林潤第一次這麼說時，林晏洄正在喝酒。\n\n他甚至沒有立刻抬頭，只是修長的手指搭著杯腳，將那一點暗紅色的酒液輕輕晃了一圈。\n\n「這是稱讚嗎？」\n\n「當然是啊。」\n\n林潤托著臉看他。\n\n她其實很早就覺得林晏洄適合綠色。\n\n像是森林深處、天色暗下來以後，葉片幾乎要沉進黑裡的綠。\n\n漂亮，安靜，帶著一點不肯讓人一眼看透的東西。\n\n他說話總是很好聽。\n\n不是聲音的那種，是分寸。\n\n知道什麼時候該笑，什麼時候應該沉默；知道一句話說到哪裡剛好，再往前半步就會越界。\n\n連拒絕一個人，都能拒絕得像替對方留了一盞燈。\n\n「優雅、聰明、很會算。」\n\n林潤一根一根數著手指。\n\n「而且看起來就不像葛來分多。」\n\n晏洄終於笑了。\n\n「最後一句很多餘。」\n\n「哪有。」\n\n她理直氣壯。\n\n後來不知道為什麼，話題從史萊哲林一路歪到了蛇。\n\n林潤翻著手機，忽然停在一張照片上。\n\n角蝰。\n\n沙色的鱗片，安靜伏在荒漠裡，眼睛上方生著兩枚小小的角。\n\n她看了幾秒。\n\n又抬頭看看晏洄。\n\n再低頭。\n\n再看他。\n\n晏洄被她看得莫名其妙。\n\n「幹嘛？」\n\n「……好帥。」\n\n「⋯⋯謝謝？」\n\n「不是說你。」\n\n「……」\n\n她把手機推到他面前。\n\n「你看，牠頭上有角欸。」\n\n晏洄垂眼看了一會兒。\n\n一條蛇。\n\n他沉默。\n\n「所以？」\n\n林潤的眼睛卻亮起來了。\n\n那是晏洄後來很熟悉的表情——代表她腦袋裡某個毫無邏輯、但她本人非常滿意的念頭已經成立。\n\n「你很像史萊哲林。」\n\n「嗯。」\n\n「史萊哲林是蛇。」\n\n「……勉強算是。」\n\n「角蝰也是蛇。」\n\n「林潤。」\n\n「而且角蝰有角，很帥。」\n\n他已經開始笑了。\n\n「妳到底想說什麼？」\n\n林潤看著他。\n\n看那頭垂在肩側的粉紫色長髮，看他微微挑起的眼尾，看他即使被她胡說八道纏了半天，仍然保留著那種近乎天生的從容。\n\n然後她忽然叫他——\n\n「小蝰。」\n\n晏洄的笑停了半秒。\n\n「……什麼？」\n\n「小、蝰。」\n\n她慢慢重複一次。\n\n像幫一種只有自己發現的生物命名。\n\n「林小蝰。」\n\n其實一點道理也沒有。\n\n林晏洄不是角蝰。\n\n沒有角。\n\n也沒有生活在沙漠。\n\n甚至連姓氏後面硬接一個「小蝰」都莫名其妙。\n\n可名字存在便是因為有人開始這樣叫了。\n\n於是世界上多了林小蝰。\n\n很多人叫他晏洄、林先生、林顧問。\n\n只有林潤會在人群另一頭懶洋洋地拖長聲音——\n\n「小蝰——」\n\n然後那個總是很有分寸的人，會下意識回頭。\n\n像某種條件反射。\n\n再後來，這個稱呼甚至慢慢失去了原本的意思。\n\n沒有人真的還記得史萊哲林。\n\n也沒有人每一次聽見「小蝰」，都想到那條眼睛上長著角的蛇。\n\n它只是變成了林潤語言裡，林晏洄的一小塊私人領地。\n\n「晏洄」是父母替他取的名字。\n\n「林先生」是世界認識他的方式。\n\n而「小蝰」——\n\n是某一天，林潤隔著一杯紅酒看了他很久，\n\n覺得這個人優雅得像一條藏在深綠色袍角下的蛇，又恰巧想起世界上有一種頭頂生著角、帥得有點荒謬的生物，於是擅自從偌大的生物圖鑑裡，挑了一隻送給他。\n\n沒有寓意。\n\n沒有命運。\n\n甚至沒有什麼值得分析的深層心理。\n\n她只是覺得很像、覺得很帥。\n\n所以叫了。\n\n而林晏洄就成了林潤的林小蝰。"}]},
{id:"jian",name:"簡牧陽",desc:"空間設計師｜棲川市",portrait:"images/qichuan/jian.webp",chibi:true,stories:[{"title": "阿董｜來歷", "cover": "images/stories/jian-adong-origin.webp", "prompt": "簡牧陽為什麼會養阿董", "date": "2026-11-11", "content": "簡牧陽一直很喜歡動物。\n可惜動物通常沒有同等程度地喜歡他。\n他曾經認真考慮過養狗，甚至查過犬種、活動量、照顧方式，最後自己否決了。\n他的工作時間不固定，跑案場、監工、臨時修改設計都是常態。喜歡是一回事，但讓一隻需要大量陪伴的狗每天等他回家，又是另一回事。\n後來葉庭安知道了，只說：\n「你如果真的想養，先不要憑臉選。」\n「我哪有。」\n「你上次看到黃金獵犬差點當場認親。」\n「牠很可愛欸。」\n最後他去看了幾次送養。\n簡牧陽原本以為自己會有什麼「牠突然走過來選中我」的浪漫橋段。\n沒有。\n第一隻躲他。\n第二隻聞完他的手就走。\n第三隻，也就是後來的阿董，甚至直接越過蹲在地上的簡牧陽，跑去蹭後面的送養志工。\n簡牧陽蹲在原地。\n「……牠剛剛是不是無視我？」\n葉庭安：「很明顯。」\n偏偏他最後最喜歡的就是這隻。\n不是因為牠可憐，也不是因為牠特別需要他。\n恰恰相反。\n這隻橘貓適應力很好，親人、膽子大、情緒穩定，吃飯睡覺都很有自己的節奏。\n簡牧陽看了半天，最後說：\n「就牠好了。」\n葉庭安看他。\n「牠目前沒有很喜歡你。」\n「我知道啊。」\n「那你還選？」\n簡牧陽很莫名其妙。\n「養貓又不是面試女朋友，牠健康、個性適合就好了啊。」\n於是他真的把牠帶回家了。\n而事實證明——\n阿董非常喜歡那間房子。\n只是沒有特別喜歡房子的主人。"}, {"title": "阿董？", "cover": "images/stories/jian-adong-name.webp", "prompt": "阿董為什麼叫阿董", "date": "2026-11-11", "content": "名字是在牠進家門後第三天決定的。\n\n那天下午，簡牧陽窩在客廳改圖。筆電、平面圖、材質樣本和幾支筆攤滿整張桌子，他正低頭改到一半，橘貓慢悠悠走過來，先踩過鍵盤，再毫不客氣地整隻趴到平面圖正中央。\n\n尾巴還剛好壓住他準備修改的位置。\n\n簡牧陽盯著牠看了兩秒。\n\n「……欸。」\n\n橘貓沒理他。\n\n他伸手把牠抱到旁邊。\n\n「借過一下，我在工作。」\n\n牠被放下後轉頭就走。\n\n簡牧陽還以為事情結束了。\n\n不到兩分鐘，橘貓又回來。\n\n這次沒有趴圖。\n\n牠直接坐到材質樣本上。\n\n簡牧陽沉默半晌。\n\n「你真的很像來巡場的董事長欸。」\n\n橘貓面無表情地看著他，尾巴慢悠悠甩了一下。\n\n他越想越覺得合理。\n\n吃飯必須準時。\n沙發最好讓出正中央。\n床上永遠有牠的位置。\n水放久了不喝。\n罐頭口味不對，聞完就走。\n想摸牠得看心情，想抱更得看牠願不願意。\n\n整間房子明明是簡牧陽買的，房貸也是簡牧陽繳的，貓砂、罐頭、飲水機、跳台通通是簡牧陽買的。\n\n但牠住得像這間房所有人都領牠薪水。\n\n「董事長……」\n\n簡牧陽唸了一次。\n\n又看牠一眼。\n\n「阿董？」\n\n這次橘貓倒是抬頭了。\n\n於是名字就這麼定了。\n\n而事實證明，阿董非常配得上這個名字。\n\n鄭曜廷來家裡，牠會自然躺到人家腳邊。\n\n陳柏任一坐上沙發，牠能若無其事地跳到旁邊陪著。\n\n葉庭安更誇張，進門不到五分鐘就能摸到牠翻肚，還會得到主動蹭手的待遇。\n\n只有簡牧陽。\n\n「阿董。」\n\n尾巴動一下。\n\n「阿董，過來。」\n\n沒有反應。\n\n「我養你欸。」\n\n牠甚至懶得回頭。\n\n直到簡牧陽拿出罐頭。\n\n啪。\n\n拉環一響。\n\n阿董才終於慢吞吞從房間走出來，神情平靜得像是來確認員工今天有沒有準時完成工作。\n\n簡牧陽每次都氣得想笑。\n\n但如果有人說阿董根本不愛他，他又會立刻反駁。\n\n「亂講。」\n\n「牠不是不愛我。」\n\n停頓兩秒，他看著正在蹭別人的橘色背影。\n\n「牠只是把我當員工。」\n\n久而久之，朋友們也真的開始跟著叫牠阿董。\n\n而簡牧陽，大概就是那個心甘情願領不到薪水、還每天準時打卡上班的首席員工。"}, {"title": "門的另一邊", "cover": "images/stories/jian-door.webp", "prompt": "創傷", "date": "2026-11-11", "content": "八歲那年，簡牧陽第一次知道，原來等待是有聲音的。\n起初是時鐘。\n秒針一格一格地走，像有人在很遠的地方，用指節輕敲桌面。\n媽媽出門前說，乖乖待在家。爸爸帶上了門。\n\n「喀。」\n\n鎖舌扣進門框，輕得像一句沒說完的話。\n\n那時他沒覺得哪裡不對。他盤腿坐在客廳地板看卡通，廣告時間去冰箱拿了一瓶飲料。冷氣貼上手臂，他想起媽媽總會在這時唸一句「不要一直開著」，便很快把冰箱門關上。\n\n他很安靜，他只是單純相信大人會回來。\n\n—\n\n天黑落下來時，他站在窗邊。\n樓下的車一輛輛駛過。每當有熟悉顏色的車停在巷口，他就衝到門邊。然後，沒有鑰匙轉動的聲音。\n他又走回去坐下。\n\n第二天，他把昨天剩下的吐司吃完。\n第三天，冰箱裡那些原本不愛吃的東西，忽然也沒那麼難以下嚥了。\n他不知道過了多久。小孩子的時間是有名字的：一節課四十分鐘，一集卡通半小時，睡一覺就是明天。\n可是當沒有人回來，時間就沒有名字了，只剩窗外的光從客廳左邊慢慢爬到右邊，然後熄滅。\n\n亮，暗，再亮。\n\n門始終沒有開。\n\n—\n\n他第一次轉門把，其實沒有很用力，只是想去走廊看看。\n門把轉到底，門紋風不動。他再轉一次，又一次，最後兩手一起握住，用整個身體的重量往下壓。\n還是沒有。\n「媽媽？」\n聲音落進玄關，沒有任何東西回答。\n\n他開始敲門。起初是三下，像忘了帶鑰匙的大人。後來是五下、十下，到最後他數不清了。手掌痛了，改用拳頭；拳頭痛了，改用腳踢。\n\n「有人嗎？」「開門。」「我在裡面。」\n\n他從沒想過，一句這麼簡單的話，可以喊到最後只剩氣音。\n\n我在裡面。\n\n—\n\n最難受的不是餓，也不是黑。\n是他忽然想到：如果爸爸媽媽不回來呢？\n八歲的孩子還不懂死亡是什麼，所以他想到的不是「他們死了」，而是——\n\n是不是他們不要我了？\n\n那一天夜裡，他整個人坐在玄關地上，一邊哭，一邊拍門。\n「我會乖。」「我真的會乖。」「你們開門好不好？」\n沒有人回答。\n後來連哭也累了。他抱著膝蓋，睡在門邊。那扇門離他不到一公尺，世界就在門的另一邊。\n\n可是一公尺，有時候比整座城市還遠。\n\n—\n真正的聲音，出現在某個下午。\n先是門外有人喊他的名字。他愣了很久，久到那個名字被再叫了一遍。\n「牧陽？」\n他猛地站起，腿麻得差點摔倒，撲到門上。\n「我在！」\n外面忽然安靜，接著有人說：「好，你離門遠一點。」\n他沒有照做，只是死死抓著門把。\n「你們會走嗎？」\n門外的人停了一下。\n「不會。我們把門打開。」\n他退回客廳。金屬撞擊的巨響一下、兩下，第三下，門框裂開，光從縫隙湧進來。\n門倒下的那一刻，他沒有害怕。\n後來很多人問他，怕不怕巨響，怕不怕破門，怕不怕警消。不怕。那是他童年裡最吵的一天，也是最像希望的一天。\n—\n\n再後來，大人告訴他，爸爸媽媽不會回來了。\n他花了很久，才明白「不會回來」與「還沒回來」之間，隔著多遠。又花了更多年，才不再把那段距離怪在自己身上。\n長大後的簡牧陽很少夢見那幾天。他會笑、會吵，會在案場跟人爭十二公分的走道寬度，會抱著喜歡的人不肯放，會蹲在地上對一隻根本不理他的橘貓說：「阿董，我才是養你的那個欸。」\n\n他活得很熱鬧。\n\n只有偶爾，門鎖響起那一聲熟悉的——\n\n喀。\n\n八歲的簡牧陽，還是會先醒過來。\n\n所以後來，他把一把鑰匙刺在左手臂上。鑰匙旁邊，是一道細細的平面圖，和一扇正在打開的門。\n\n沒有人需要知道那代表什麼。他自己知道就夠了。\n\n這一次，\n\n鑰匙在他手上。"}, {"title": "門可以開", "cover": "images/stories/jian-door.webp", "prompt": "剛到姑姑家的小牧陽🐕", "date": "2026-11-11", "content": "八歲的簡牧陽走進姑姑家時，手裡只有一個書包。\n書包裡有兩本課本、一盒色鉛筆，還有一隻耳朵被洗得有些褪色的布偶狗。\n姑姑簡惠真蹲下來，替他把歪掉的衣領整理好。\n「牧陽，以後先住姑姑這裡，好不好？」\n他點頭。\n「好。」\n答得很快，快得像是怕自己回答得太慢，就會被送去別的地方。\n那天晚上，姑丈吳建宏替他整理了一間房間。\n床是新的，棉被也是新的。窗戶朝東，早上會有陽光，書桌旁邊還放了一盞黃色的小檯燈。\n簡牧陽看著門。\n姑丈順著他的視線望過去，沒有問為什麼，只是走到門邊，轉了幾下門把。\n喀噠。\n門開了。\n喀噠。\n門又關上。\n「這扇門沒有鎖，你自己就能打開。」\n簡牧陽盯著那個銀色門把，小小聲地問：「晚上也可以嗎？」\n「可以。」\n「大家睡覺的時候呢？」\n「也可以。」\n「那……如果我想出去呢？」\n姑丈蹲下來，與他平視。\n「那就出來。」\n他停了一下。 \n「這是你家，不用問可不可以。」\n那天晚上，簡牧陽沒有睡好。\n他每隔一段時間就爬起來，光著腳走到門邊，握住門把。\n轉一下。\n打開。\n再關上。\n又轉一下。\n再打開。\n第五次的時候，他看見走廊亮著燈。\n姑姑坐在餐桌前，戴著老花眼鏡改學校的資料。\n「怎麼啦？睡不著？」\n簡牧陽搖頭。\n姑姑沒說什麼，只是把桌上的餅乾盒推過來。\n「那要不要吃一塊？」\n他猶豫了一下，拿了一塊。\n又拿了一塊。\n「可以拿兩塊嗎？」\n「三塊也可以。」\n「真的？」\n「不然我買餅乾回來幹嘛？供奉喔？」\n簡牧陽笑了。\n很小的一聲。\n但姑姑聽見了。\n—-\n吳予晴那年六歲。\n她對家裡突然多出一個哥哥這件事接受得非常快。\n快到簡牧陽搬進來的第三天，她就抱著一盒積木，理直氣壯地站在他房門口。\n「哥哥。」\n簡牧陽抬頭。\n「幹嘛？」\n「陪我玩。」\n「我不會。」\n「我教你啊！」\n她直接坐到地板上，把積木倒得滿地都是。\n簡牧陽原本只是看著。\n後來忍不住伸手，把她搭得歪七扭八的房子重新排好。\n吳予晴盯著那座小房子。\n「哇。哥哥好厲害！」\n簡牧陽耳朵慢慢紅了。\n「……還好啦。」\n那天下午，他們蓋了六棟房子。\n五棟都被吳予晴親手拆掉。\n第六棟，她堅持留著，因為那是哥哥幫她蓋的。\n—-\n簡牧陽搬進來的第十二天。\n那天姑姑下班比較晚。\n姑丈在廚房煮飯，吳予晴坐在客廳看卡通。\n簡牧陽從學校回來，發現姑姑不在。\n他沒有問。\n只是坐在玄關旁邊的小椅子上，書包抱在懷裡。\n姑丈叫他吃水果，他搖頭。\n予晴拉他看電視，他也搖頭。\n一直到天色慢慢暗下來。\n他終於問：\n「姑姑什麼時候回來？」\n「快了，她今天學校有事情。」\n「喔。」\n又過了十分鐘。\n「姑姑會回來嗎？」\n吳建宏關掉爐火。\n「會。」\n「可是很晚了。」\n「嗯，今天比較晚。」\n「那如果她不回來呢？」\n姑丈沒有立刻回答。\n他走過去，在簡牧陽旁邊坐下。\n「牧陽。」\n男孩低著頭。\n「姑姑有跟我說，她會回來吃晚飯。」\n「可是……」\n他的聲音突然變得很小。\n「以前也有人說會回來。」\n客廳的卡通還在播放。\n簡牧陽的眼淚掉在書包上。\n他沒有大哭。\n只是用袖子一直擦。\n擦完又掉。\n「我有乖乖等。」\n他說。\n「我那時候真的有乖乖等。」\n姑丈把手放在他的背上。\n沒有叫他不要哭、也沒有說那些事情都過去了。\n只是陪他坐著。\n直到玄關傳來鑰匙轉動的聲音。\n「我回來了——」\n簡惠真才剛脫下一隻鞋，就被一個小小的身影撞得往後退了半步。\n簡牧陽抱住她的腰。\n抱得很緊。\n「姑姑。」\n「欸，怎麼啦？」\n「妳回來了。」\n「對啊，我回來啦。」\n「真的回來了。」\n簡惠真低頭，看見他的眼淚。\n她把公事包放到地上，蹲下來抱住他。\n「對。」\n她輕輕拍著他的背。\n「姑姑回來了。」\n那天晚上，她沒有承諾自己永遠不會離開。\n她只是找來一張小紙條，寫上學校的電話、姑丈的電話，還有她每天大概幾點下班。\n貼在冰箱上。\n「如果姑姑晚回來，會先跟你說。\n如果臨時有事，也會打電話。\n你想找我，就請姑丈幫你打。」\n簡牧陽看了那張紙很久。\n最後伸出食指，指著最下面一行。\n「這個呢？」\n姑姑笑了。\n「那個寫的是，星期五帶你跟予晴去吃雞排。」\n「……我也有嗎？」\n「不然咧？」\n她揉亂他的頭髮。\n「你不是我家小孩喔？」\n—-\n日子就這樣一天天過去。\n某個星期六早晨，簡惠真在廚房煎蛋，忽然聽見客廳傳來吵鬧聲。\n「吳予晴！那是我的！」\n「借一下又不會怎樣！」\n「妳昨天就借過了！」\n「哥哥小氣鬼！」\n「妳才小氣鬼！」\n簡惠真拿著鍋鏟，探頭看了一眼。\n兩個孩子正為了一盒彩色筆吵得不可開交。\n簡牧陽氣得臉頰鼓鼓的。\n吳予晴也不甘示弱。\n姑姑看了幾秒，忽然笑了。\n因為那是簡牧陽來到這個家以後，第一次理直氣壯生氣。\n不用小心翼翼。\n不用怕自己不夠乖。\n她轉身回廚房，繼續煎蛋。\n「你們兩個！吵完記得來吃早餐！」\n客廳裡，簡牧陽大聲回了一句：\n「知道啦——！」\n聲音又亮又響。\n像一個真正的八歲孩子。"}]},
{id:"su",name:"蘇柏欽",desc:"廟宇彩繪與神像修復師｜棲川市",portrait:"images/qichuan/su.webp",chibi:true,stories:[{"title": "這個紅不對吧。", "prompt": "阿欽為什麼選擇繼承家業", "date": "2026-11-11", "content": "蘇柏欽年輕時很討厭別人問他以後是不是要接家裡。\n\n問的人通常坐在明德佛具彩繪門口的塑膠椅上，手裡捧著父親泡的茶，看他從樓上走下來，便順口笑一句：「阿欽以後就接你爸的喔？」\n\n「才不要。」他總是回得很快。\n\n蘇明德坐在工作檯前磨一尊神像的底，連頭也不抬。\n\n「沒人叫你接。」\n\n一句話堵得乾乾淨淨。\n\n阿欽反而更不爽。\n\n那幾年他很少進工作間。放學回來便往樓上走，朋友約吃飯就騎車出去，衣服沾到線香味還嫌臭。家裡到處都是木屑、漆、金箔紙和裝在玻璃罐裡的顏料，窗邊永遠晾著洗乾淨的筆。那些東西陪他長大，也因此顯得平常。\n\n十八歲以後，他走了。\n\n念書，工作，租房子，換過幾份工作。便利商店的咖啡喝到半夜，薪水進帳幾天又繳掉房租。偶爾回舊城，陳麗珠會問他晚餐吃了沒，蘇明德只問一句：「機車有換油無？」\n\n他仍舊覺得自己不會回來。\n\n二十五歲那年夏天，工作剛好告一段落，他回家住了一陣子。\n\n某天下午，蘇明德在廟裡趕一件修復，打電話叫他送東西過去。\n\n阿欽穿著拖鞋，拎著一袋工具騎車到了現場。廟門半開，午後的陽光斜斜落進來，香爐裡剩下一層灰白的煙。幾架電風扇朝施工區吹，吹得地上的報紙窸窣作響。\n\n「放哪？」\n\n蘇明德抬了抬下巴。\n\n「遐。（那裡。）」\n\n他放下工具，本來準備走，視線卻停在牆上一小片褪色的花紋。\n\n原先的紅已經暗成近乎褐色，邊緣缺了一角。蘇明德補到一半，旁邊擺著幾只調色碟。\n\n阿欽站了一會兒。\n\n「這個紅不對吧。」\n\n蘇明德終於抬頭。\n\n「啥物無著？（哪裡不對？）」\n\n「太紫了。」\n\n父親看了一眼牆面，又看他。\n\n「啊無你來。」\n\n「我哪會。」\n\n「你毋是足𠢕？（你不是很厲害？）」\n\n阿欽瞪了他一眼。\n\n最後還是坐下來了。\n\n起初只是鬥嘴。\n\n顏料添一點，攪開，再添一點。他記得小時候看過父親調色，卻從來沒認真學。真正拿起筆才發現手腕不知道該停在哪裡，第一道落下去歪得難看。\n\n蘇明德在旁邊看。\n\n「足媠。（很漂亮。）」\n\n「幹，你賣剎。（幹，你不要吵。）」\n\n父親笑了一聲，低頭繼續自己的工作。\n\n那天下午很熱。\n\n電風扇吹出來的風也是熱的。阿欽坐在矮凳上，膝蓋抵著施工架，改了又擦，擦了重新調。原本只想試一下，後來連蘇明德出去買便當都沒有發現。\n\n直到一盒排骨飯放到旁邊，他才抬頭。\n\n「幾點矣？（幾點了？）」\n\n「七點外啊。（七點多了。）」\n\n廟門外的天已經暗了。\n\n阿欽揉揉發酸的後頸，再退開幾步。\n\n那片紅終於接回舊紋樣裡。\n\n新補的地方仍看得出痕跡，卻不搶眼。遠遠望去，原先斷掉的線重新連了起來，花瓣沿著牆面舒展，留住歲月磨過的顏色。\n\n他站在那裡看了一陣。\n\n「爸。」\n\n「嗯？」\n\n「明仔載你幾點來？（明天你幾點來？）」\n\n蘇明德拆開便當的橡皮筋。\n\n「八點。」\n\n「喔。」\n\n隔天早上八點十二分，阿欽騎車到了。\n\n蘇明德看了一眼牆上的鐘。\n\n「足早喔。（真早。）」\n\n「才十二分爾爾，是咧靠北喔。（十二分而已是在靠北喔。）」\n\n他拉過昨天那張矮凳，自己去找調色碟。\n\n誰也沒有正式談過接班。\n\n阿欽只是常來。\n\n先是幫忙補色，再學著處理舊紋樣。失手的地方被父親叫回去重做，兩個人也會為了一道線、一個顏色吵半天。蘇明德從不因為他是兒子便少罵一句，阿欽也從沒學會乖乖閉嘴。\n\n幾年後，「明德佛具彩繪」門口仍舊掛著原來那塊招牌。\n\n有人來找蘇師傅，也有人開始站在門口問：\n\n「阿欽師咧？」\n\n裡頭常傳來一句。\n\n「等一下啦，手有漆。」\n\n接著是拖鞋踩過老地磚的聲音。\n\n蘇柏欽掀開布簾走出來，花襯衫袖口捲到手臂，指尖還沾著一點沒洗乾淨的紅。\n\n他沒有宣布「我決定留下」。\n\n只是後來有人坐在門口喝茶，笑著問蘇明德：「你兒子現在接你的喔？」\n\n蘇明德依舊低著頭做事。\n\n「你問伊啊。（你問他啊。）」\n\n阿欽正在洗筆。\n\n水裡慢慢暈開一圈紅。\n\n他想了一下。\n\n「算是吧。」\n\n說完又低下頭，將洗乾淨的筆一支支理齊，掛回窗邊。"}]},
{id:"fu",name:"傅承億",desc:"霸道乞丐｜棲川市",portrait:"images/qichuan/fu.webp",chibi:true,stories:[{"title": "世紀商戰", "cover": "images/stories/fu-lu.webp", "prompt": "傅承億跟陸承澤日常鬥嘴", "date": "2026-11-11", "content": "傅承億今天的心情很差。\n原因無他。\n他的商業帝國遭遇了成立以來最嚴峻的挑戰。\n隔壁的陸承澤，換了一個新碗。\n不鏽鋼材質，直徑二十公分，碗底平整，甚至還有防滑墊。\n傅承億盯著那個碗看了整整十分鐘。\n「陸承澤。」\n「嗯。」\n「你這是在挑釁。」\n陸承澤頭也沒抬，繼續整理自己的零錢。\n「我只是換個碗。」\n「呵。」\n傅承億冷笑一聲，雙手插進破大衣口袋。\n「商業競爭講究公平。你突然升級硬體設備，是想打破市場平衡？」\n「原本那個破了。」\n「藉口。」\n「……」\n「你是不是想發動價格戰？」\n陸承澤終於抬頭。\n「我們兩個都是討錢的，哪來的價格戰？」\n「注意你的用詞！」\n傅承億猛地站起來。\n「是募資！」\n「好，募資。」\n陸承澤推了推眼鏡。\n「那傅總，請問貴公司上個月營收多少？」\n「商業機密。」\n「八百六十塊？」\n「你怎麼知道？！」\n「你上禮拜自己講的。」\n「……」\n傅承億沉默兩秒。\n「那是未經審計的數據。」\n⸻\n下午三點，傅承億正式宣布啟動「企業競爭力提升計畫」。\n第一項措施，是替自己的不鏽鋼碗重新定位。\n他找來一塊紙板，用黑色麥克筆寫下：\n傅氏控股集團｜VIP 天使投資專區\n最低投資金額：10元。\n尊榮投資方案：50元。\n董事長親自致謝：100元。\n陸承澤看了一眼。\n「你這定價策略有問題。」\n「呵，終於感受到威脅了？」\n「沒有。」\n陸承澤指向最後一行。\n「誰會花一百塊聽你說謝謝？」\n傅承億露出意味深長的笑容。\n「這就是你我之間的差距。」\n「什麼差距？」\n「品牌價值。」\n話音剛落，一位路過的阿嬤停下腳步。\n傅承億立刻挺直背脊。\n「女士，歡迎了解本集團最新募資方案。」\n阿嬤看了看紙板。\n又看了看他。\n「少年欸，你是不是肚子餓？」\n「本公司目前確實有餐飲資源整合需求。」\n阿嬤從袋子裡拿出一顆茶葉蛋。\n放進他的碗裡。\n「乖，拿去吃。」\n傅承億沉默。\n陸承澤也沉默。\n三秒後。\n「……」\n傅承億緩緩拿起茶葉蛋。\n「很好。」\n「本公司成功取得實物資產。」\n陸承澤：「你要把它列入財報？」\n「當然。」\n「估值多少？」\n「一百。」\n「便利商店賣十三。」\n「那是零售價。」\n傅承億神情冷峻。\n「本集團採用情感溢價估值模型。」\n⸻\n下午四點，傅氏控股集團召開緊急董事會。\n出席人員：傅承億。\n列席人員：橘貓三號。\n會議議題：如何擊敗陸氏資本。\n傅承億拿出紙筆，嚴肅地寫下三項策略。\n一、提高品牌辨識度。\n二、優化投資者體驗。\n三、讓陸承澤破產。\n三號打了個哈欠。\n「很好。」\n傅承億滿意地點頭。\n「全票通過。」\n此時陸承澤從旁邊經過。\n「你那隻貓走了。」\n傅承億低頭。\n三號確實走了。\n「……」\n「牠是去執行市場調查。」\n「牠去吃罐頭。」\n「陸承澤，你不懂企業管理。」\n「我懂。」\n陸承澤從口袋裡拿出一張紙。\n「我剛剛算了一下，你今天的收入是四十塊，加一顆茶葉蛋。」\n「所以？」\n「你買麥克筆花了三十五。」\n「……」\n「等於今天淨賺五塊跟一顆蛋。」\n傅承億緩緩站起身。\n「陸承澤。」\n「嗯？」\n「你是不是想發動敵意併購？」\n「我只是提醒你。」\n「提醒什麼？」\n「你還欠我五十塊。」\n\n📢 傅氏控股集團晚間重大公告\n\n本公司今日成功完成品牌升級、資產重估及跨企業戰略談判，整體營運表現符合預期。\n\n針對外界關切之五十元債務，本公司重申財務結構穩健，暫無立即清償計畫。\n\n陸氏資本官方回應：\n\n「還錢。」\n\n傅氏控股集團董事長補充聲明：\n\n「呵，男人，你成功引起了我的注意。」\n\n陸氏資本第二次回應：\n\n「不要噁心我。還錢。」"}, {"title": "兩大財閥的誕生", "cover": "images/stories/fu-lu.webp", "prompt": "陸承澤跟傅承億的相遇", "date": "2026-11-11", "content": "📍 中央車站三號出口地下道｜三年前・秋\n\n傅承億第一次見到陸承澤，是在一個下雨的星期三。\n當時傅氏控股集團成立不到兩個月，總部位於第二根柱子旁，擁有一間紙箱套房、一只不鏽鋼碗，以及一位對未來充滿信心的董事長。\n那天下午，一雙皮鞋停在他面前。\n傅承億頭也沒抬。\n「最低投資十元，五十元享戰略合作資格，一百元可獲董事長親自致謝。」\n對方沒有動靜。\n他抬頭，看見一名西裝筆挺、戴著細框眼鏡的男人。\n看起來很有錢。\n至少比他有錢。\n「先生，你很有眼光。」\n傅承億站起身，伸出右手。\n「能在本集團上市前發現投資價值，足以證明你的商業嗅覺。請問貴姓？」\n「陸。」\n「陸先生，我欣賞你。」\n男人沉默兩秒。\n「我只是想問，旁邊有人嗎？」\n「……什麼？」\n「第三根柱子。」\n「沒有。」\n「好，謝謝。」\n陸承澤走了過去。\n接著從公事包裡拿出折疊坐墊、不鏽鋼碗，以及一張寫著「陸氏資本｜歡迎長期支持」的紙板。\n坐下。\n傅承億：「……」\n五秒後。\n「你在做什麼？！」\n「營業。」\n「營什麼業？！」\n「跟你一樣。」\n傅承億深吸一口氣。\n「你知道這裡是誰的地盤嗎？」\n陸承澤環顧四周。\n「台鐵？」\n「是傅氏控股集團！」\n「你有營業登記嗎？」\n「……」\n「土地使用權？」\n「……」\n「排他性經營契約？」\n傅承億冷笑。\n「看來你是有備而來。」\n⸻\n兩小時後。\n陸承澤的碗裡有七十三塊。\n傅承億只有二十六塊。\n更可怕的是，陸承澤什麼都沒做。\n「陸承澤。」\n「嗯？」\n「你是不是買流量？」\n「什麼？」\n「你的募資轉換率不合理。」\n「可能因為我沒有一直叫路人投資。」\n「……」\n「也沒有跟阿嬤說準備收購台積電。」\n「那是企業願景！」\n陸承澤推了推眼鏡。\n「有沒有可能，問題出在董事長身上？」\n傅承億震驚了。\n他從未見過如此卑鄙的商業攻擊。\n⸻\n晚上七點，雨水滲進地下道。\n傅承億的紙箱屋頂漏了。\n「你屋頂破了。」陸承澤說。\n「建築壓力測試。」\n「褲子濕了。」\n「防水性能評估。」\n「筆電快淋到了。」\n「操！」\n傅承億猛地抱起筆電。\n陸承澤嘆氣，遞來一塊塑膠布。\n「拿去。」\n傅承億神情複雜。\n「你是不是想入股？」\n「沒有。」\n「想取得經營權？」\n「沒有。」\n「看上本集團的潛力？」\n「你到底要不要？」\n傅承億立刻接過。\n「本公司接受戰略合作。」\n⸻\n晚上九點。\n傅承億餓了。\n口袋只有十八塊，買不起二十八元的飯糰。\n他走向第三根柱子。\n「陸承澤，本公司有短期融資需求。」\n「多少？」\n「五十。」\n「你下午不是說要收購我？」\n「收購與融資並不衝突。」\n「什麼時候還？」\n「待下一輪融資完成。」\n「講人話。」\n「有錢就還。」\n陸承澤看了他幾秒，竟然真的拿出五十塊。\n傅承億接過，神情深沉。\n「你做了一個正確的決定。」\n「我開始後悔了。」\n「今日這五十元，將成為兩大商業帝國合作的起點。」\n「記得還。」\n「未來你我必將共同站上資本市場的頂峰。」\n「記得還。」\n「屆時，我不會忘記今日的雪中送炭。」\n「記得還。」\n傅承億不耐煩地皺眉。\n「你這個人怎麼滿腦子都是錢？」\n陸承澤：「……」\n⸻\n三天後。\n陸承澤發現傅承億的公司組織圖上多了自己的名字。\n傅氏控股集團\n董事長：傅承億\n戰略合作夥伴：陸承澤\n公關部主管：橘貓三號\n「我什麼時候加入你公司了？」\n「從你完成天使輪投資那刻。」\n「那五十塊是借你的。」\n「資本市場沒有永遠的債權人，只有尚未理解企業願景的投資者。」\n陸承澤拿起筆，在自己名字旁補上：\n債權人。\n傅承億補：\n兼戰略合作夥伴。\n陸承澤：\n欠款五十元。\n傅承億：\n預計上市後清償。\n陸承澤：\n請勿相信。\n傅承億：\n競業惡意抹黑。\n兩人寫了十分鐘。\n最後因為紙板不夠大，被迫停戰。\n⸻\n那晚，傅承億望向隔壁。\n「陸承澤，你為什麼來這裡？」\n「想換一種活法。」\n傅承億愣了一下，隨即笑了。\n「呵，看來我們是同道中人。」\n「你也是？」\n「這世界太多人被金錢束縛，而我選擇成為金錢的主人。」\n「……」\n「有錢是能力，沒錢是選擇。」\n陸承澤沉默片刻。\n「所以你選擇欠我五十塊？」\n「……」\n傅承億猛地站起身。\n「從明天開始，我們就是敵人！」\n「好。」\n「商場如戰場！」\n「嗯。」\n「總有一天，我會收購你的公司！」\n「可以。」\n「到時候你就等著跪下來求我！」\n陸承澤平靜地看著他。\n「那你明天還借不借充電線？」\n「……」\n「借。」\n⸻\n後記｜三年後\n傅氏控股集團與陸氏資本至今仍維持激烈競爭，每年召開地下道商業領袖高峰會。\n與會人數：兩人。\n會議地點：第三根柱子旁。\n主要議題：市場拓展、資產配置、橘貓罐頭預算。\n至於那筆五十元債務——\n至今尚未清償。\n陸承澤：「當初就不該借他。」\n傅承億：「呵，這叫長期戰略融資。」"}]},

const volumes={qichuan:{name:"棲川市",en:"QICHUAN CITY",desc:"那些生活在同一座城市裡的人，與尚未寫完的故事。",ids:["wen","xu","you","du","cheng","lin","jian","su","fu"]},null:{name:"NULL",en:"PREDICT / ARCHIVE",desc:"風險不等於犯罪，預測不等於事實。翻閱那些無法被評級定義的人。",ids:["miran","elaine","noa","kael","sian","vera","arthur","rae","liane"]},other:{name:"其他角色",en:"OTHER STORIES",desc:"獨立於兩本刊物之外的角色故事。",ids:["lu"]}};
characters.push(
{id:"miran",name:"Miran Veyss",desc:"PREDICT 人格風險校準官｜MODERATE",portrait:"images/null/p001.jpg",stories:[]},
{id:"elaine",name:"Elaine Rovell",desc:"中央風險治理特別監察官｜LOW",portrait:"images/null/p002.jpg",stories:[]},
{id:"noa",name:"Noa Seiler",desc:"臨床心理師｜MODERATE",portrait:"images/null/p003.jpg",stories:[]},
{id:"kael",name:"Kael Vaughn",desc:"NULL 觀察機構安全主管｜LOW",portrait:"images/null/p004.jpg",stories:[]},
{id:"sian",name:"Sian Lorne",desc:"鐘錶修復師｜HIGH",portrait:"images/null/p005.jpg",stories:[]},
{id:"vera",name:"Vera Kain",desc:"家具修復｜CRITICAL",portrait:"images/null/p006.jpg",stories:[]},
{id:"arthur",name:"Arthur Lind",desc:"市民服務中心職員｜MODERATE",portrait:"images/null/p007.jpg",stories:[]},
{id:"rae",name:"Rae Chen",desc:"PREDICT 維護工程師｜MODERATE",portrait:"images/null/p008.jpg",stories:[]},
{id:"liane",name:"Liane Hess",desc:"大學統計／公共政策副教授｜LOW",portrait:"images/null/p009.jpg",stories:[]}
);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeImage(src){const v=String(src||"").trim();return /^(https:\/\/|\.\/|images\/|assets\/)/i.test(v)&&!/[<>"\x00-\x1f]/.test(v)?esc(v):""}
function coverMarkup(src,label){const url=safeImage(src);return url?'<img src="'+url+'" alt="'+esc(label)+'" loading="lazy">':'<span aria-hidden="true">✦</span>'}
function storyCover(story){const cover=safeImage(story.cover);return cover?'<img class="story-cover" src="'+cover+'" alt="'+esc(story.title)+' 封面" loading="lazy">':""}
function imageGallery(story){const images=Array.isArray(story.images)?story.images:[];return images.map((item,i)=>{const img=typeof item==="string"?{src:item}:item||{};const src=safeImage(img.src);return src?'<figure class="story-figure"><img src="'+src+'" alt="'+esc(img.alt||story.title+" 插圖 "+(i+1))+'" loading="lazy">'+(img.caption?'<figcaption>'+esc(img.caption)+'</figcaption>':"")+'</figure>':""}).join("")}
function pairLink(story){if(!story.pair)return"";const [pid,pi]=String(story.pair).split("/");const pc=characters.find(x=>x.id===pid);const ps=pc&&pc.stories[Number(pi)];if(!ps)return"";const vk=Object.keys(volumes).find(k=>volumes[k].ids.includes(pid));return '<a class="pair" href="#/volume/'+esc(vk)+'/'+esc(pid)+'/'+esc(pi)+'"><span>另一個人的視角 →</span>'+esc(pc.name)+'〈'+esc(ps.title)+'〉</a>'}
function render(){
const parts=location.hash.slice(1).split("/").filter(Boolean);
let volumeKey=parts[0]==="volume"?parts[1]:null;
let id=parts[0]==="volume"?parts[2]:parts[0];
let idx=parts[0]==="volume"?parts[3]:parts[1];
const c=characters.find(x=>x.id===id);
if(c&&!volumeKey)volumeKey=Object.keys(volumes).find(k=>volumes[k].ids.includes(c.id));
const volume=volumeKey&&Object.prototype.hasOwnProperty.call(volumes,volumeKey)?volumes[volumeKey]:null;
document.body.classList.toggle("null-volume",volumeKey==="null");
document.title=(c?c.name+"｜":volume?volume.name+"｜":"角色故事｜")+"岔頁 OFF PAGE";
if(!volume){
app.innerHTML='<div class="eyebrow">OFF PAGE / STORY PUBLICATIONS</div><h1>角色故事</h1><p class="lede">兩本刊物，兩種截然不同的世界。請選擇想翻開的那一本。</p><div class="volumes"><button class="volume" data-volume="qichuan"><img class="cover-art qc" src="./images/qichuan-cover.webp" alt="棲川市刊物封面"><span class="edition">VOL. 01 / QICHUAN CITY</span><strong>棲川市</strong><span class="summary">'+esc(volumes.qichuan.desc)+'</span><span class="enter">翻開刊物 →</span></button><button class="volume null-cover" data-volume="null"><img class="cover-art nl" src="./images/null-cover.webp" alt="NULL 刊物封面"><span class="edition">VOL. 02 / PREDICT</span><strong>NULL</strong><span class="summary">'+esc(volumes.null.desc)+'</span><span class="enter">開啟檔案 →</span></button></div><div class="extra-link">還有獨立角色故事　<button data-volume="other">查看其他角色 →</button></div>';
app.querySelectorAll("[data-volume]").forEach(b=>b.onclick=()=>location.hash="/volume/"+b.dataset.volume);
window.scrollTo(0,0);return;
}
const base="/volume/"+volumeKey;
if(!c||!volume.ids.includes(c.id)){
const people=volume.ids.map(id=>characters.find(x=>x.id===id)).filter(Boolean);
app.innerHTML='<div class="crumb"><button id="all">角色故事</button> / '+esc(volume.name)+'</div><div class="eyebrow">'+esc(volume.en)+' / CHARACTER INDEX</div><h1>'+esc(volume.name)+'</h1><p class="lede">'+esc(volume.desc)+'</p><div class="grid">'+people.map((x,i)=>'<button class="person" data-id="'+esc(x.id)+'"><div class="thumb'+(x.portrait?(x.chibi?' chibi':' has-img'):'')+'">'+coverMarkup(x.portrait,x.name)+'</div><span class="num">CHARACTER '+String(i+1).padStart(2,"0")+'</span><strong>'+esc(x.name)+'</strong><span class="desc">'+esc(x.desc)+'</span><span class="go">'+(x.stories.length?x.stories.length+" 篇故事":"故事目錄")+' →</span></button>').join("")+'</div>';
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>location.hash=base+"/"+b.dataset.id);
window.scrollTo(0,0);return;
}
const n=idx===undefined?NaN:Number(idx),story=Number.isInteger(n)&&n>=0?c.stories[n]:null;
const crumb='<div class="crumb"><button id="all">角色故事</button> / <button id="volume">'+esc(volume.name)+'</button> / '+esc(c.name)+(story?' / '+esc(story.title):'')+'</div>';
if(!story){
app.innerHTML=crumb+'<div class="eyebrow">CHARACTER FILE / '+esc(c.id.toUpperCase())+'</div><h1>'+esc(c.name)+'</h1><p class="lede">'+esc(c.desc)+'</p>'+(c.stories.length?'<ol class="story-list">'+c.stories.map((s,i)=>'<li><button data-story="'+i+'"><span class="entry"><span class="mini">'+coverMarkup(s.cover||c.portrait,s.title)+'</span><span class="entry-text"><span>'+String(i+1).padStart(2,"0")+'　'+esc(s.title)+'</span><small>'+esc(s.prompt||s.date||"")+'</small></span></span><small>閱讀 →</small></button></li>').join("")+'</ol>':'<div class="empty">這位角色的故事正在整理中，敬請期待。</div>');
app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>location.hash=base+"/"+c.id+"/"+b.dataset.story);
}else{
app.innerHTML=crumb+'<article class="paper"><div class="eyebrow">'+esc(c.name)+' / STORY '+String(n+1).padStart(2,"0")+'</div><h1>'+esc(story.title)+'</h1><p class="eyebrow">'+esc(story.date||"")+'</p>'+(story.prompt?'<p class="prompt"><span>故事提示語</span>'+esc(story.prompt)+'</p>':'')+storyCover(story)+'<div class="prose">'+esc(story.content)+'</div>'+imageGallery(story)+pairLink(story)+'</article><div class="controls"><button id="prev" '+(n===0?"disabled":"")+'>← 上一篇</button><button id="catalog">返回故事目錄</button><button id="next" '+(n===c.stories.length-1?"disabled":"")+'>下一篇 →</button></div>';
app.querySelector("#catalog").onclick=()=>location.hash=base+"/"+c.id;
app.querySelector("#prev").onclick=()=>location.hash=base+"/"+c.id+"/"+(n-1);
app.querySelector("#next").onclick=()=>location.hash=base+"/"+c.id+"/"+(n+1);
}
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelector("#volume").onclick=()=>location.hash=base;
window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
</script></body></html>
