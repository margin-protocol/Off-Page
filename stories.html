25px}.crumb button{border:0;background:none;color:var(--berry);padding:0}.story-list{list-style:none;padding:0;margin:30px 0;border-top:1px solid var(--ink)}.story-list li{border-bottom:1px solid var(--rule)}.story-list .entry{display:flex;align-items:center;gap:16px}.story-list .mini{width:76px;height:92px;flex:none;background:#EBCBD3;display:grid;place-items:center;color:var(--berry)}.story-list .mini img{width:100%;height:100%;object-fit:cover}.story-list .entry-text{display:flex;flex-direction:column}.story-list button{width:100%;border:0;background:none;padding:20px 4px;text-align:left;display:flex;justify-content:space-between;gap:20px}.story-list button:hover{color:var(--berry)}.story-list small{color:var(--muted)}.paper{background:var(--paper);border:1px solid var(--rule);padding:clamp(24px,5vw,60px);max-width:780px}.paper h1{color:var(--ink);font-size:36px}.story-cover,.story-figure img{display:block;width:100%;height:auto;border:1px solid var(--rule)}.story-cover{max-height:490px;object-fit:cover;margin:0 0 28px}.story-figure{margin:28px 0}.story-figure figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.prompt{margin:0 0 30px;padding:12px 16px;border-left:3px solid var(--berry);background:var(--cream);font-size:15px;line-height:1.8}.prompt span{display:block;font-size:12px;letter-spacing:.16em;color:var(--muted)}.prose{white-space:pre-wrap;line-height:2.15;overflow-wrap:anywhere}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.controls button{border:1px solid var(--rule);background:var(--paper);padding:8px 16px;color:var(--berry)}.controls button:disabled{opacity:.35;cursor:default}.empty{background:var(--paper);border:1px dashed var(--rule);padding:38px 24px;color:var(--muted)}footer{border-top:1px solid var(--rule);padding:24px 0;color:var(--muted);font-size:13px}@media(max-width:500px){main.wrap{padding-top:35px}.person{min-height:155px}}

px){.volumes{grid-template-columns:1fr}.volume{min-height:235px}}</style></head><body><header><div class="wrap head"><a class="logo" href="./index.html#home">岔頁 <small>OFF PAGE</small></a><a class="back" href="./index.html#home">返回首頁 ↗</a></div></header><main class="wrap" id="app"></main><footer><div class="wrap">OFF PAGE — by Xia mumu · CHARACTER ARCHIVE</div></footer><script>

{id:"su",name:"蘇柏欽",desc:"廟宇彩繪與神像修復師｜棲川市",portrait:"images/qichuan/su.webp",chibi:true,stories:[{"title": "這個紅不對吧。", "prompt": "阿欽為什麼選擇繼承家業", "date": "2026-11-11", "content": "蘇柏欽年輕時很討厭別人問他以後是不是要接家裡。\n\n問的人通常坐在明德佛具彩繪門口的塑膠椅上，手裡捧著父親泡的茶，看他從樓上走下來，便順口笑一句：「阿欽以後就接你爸的喔？」\n\n「才不要。」他總是回得很快。\n\n蘇明德坐在工作檯前磨一尊神像的底，連頭也不抬。\n\n「沒人叫你接。」\n\n一句話堵得乾乾淨淨。\n\n阿欽反而更不爽。\n\n那幾年他很少進工作間。放學回來便往樓上走，朋友約吃飯就騎車出去，衣服沾到線香味還嫌臭。家裡到處都是木屑、漆、金箔紙和裝在玻璃罐裡的顏料，窗邊永遠晾著洗乾淨的筆。那些東西陪他長大，也因此顯得平常。\n\n十八歲以後，他走了。\n\n念書，工作，租房子，換過幾份工作。便利商店的咖啡喝到半夜，薪水進帳幾天又繳掉房租。偶爾回舊城，陳麗珠會問他晚餐吃了沒，蘇明德只問一句：「機車有換油無？」\n\n他仍舊覺得自己不會回來。\n\n二十五歲那年夏天，工作剛好告一段落，他回家住了一陣子。\n\n某天下午，蘇明德在廟裡趕一件修復，打電話叫他送東西過去。\n\n阿欽穿著拖鞋，拎著一袋工具騎車到了現場。廟門半開，午後的陽光斜斜落進來，香爐裡剩下一層灰白的煙。幾架電風扇朝施工區吹，吹得地上的報紙窸窣作響。\n\n「放哪？」\n\n蘇明德抬了抬下巴。\n\n「遐。（那裡。）」\n\n他放下工具，本來準備走，視線卻停在牆上一小片褪色的花紋。\n\n原先的紅已經暗成近乎褐色，邊緣缺了一角。蘇明德補到一半，旁邊擺著幾只調色碟。\n\n阿欽站了一會兒。\n\n「這個紅不對吧。」\n\n蘇明德終於抬頭。\n\n「啥物無著？（哪裡不對？）」\n\n「太紫了。」\n\n父親看了一眼牆面，又看他。\n\n「啊無你來。」\n\n「我哪會。」\n\n「你毋是足𠢕？（你不是很厲害？）」\n\n阿欽瞪了他一眼。\n\n最後還是坐下來了。\n\n起初只是鬥嘴。\n\n顏料添一點，攪開，再添一點。他記得小時候看過父親調色，卻從來沒認真學。真正拿起筆才發現手腕不知道該停在哪裡，第一道落下去歪得難看。\n\n蘇明德在旁邊看。\n\n「足媠。（很漂亮。）」\n\n「幹，你賣剎。（幹，你不要吵。）」\n\n父親笑了一聲，低頭繼續自己的工作。\n\n那天下午很熱。\n\n電風扇吹出來的風也是熱的。阿欽坐在矮凳上，膝蓋抵著施工架，改了又擦，擦了重新調。原本只想試一下，後來連蘇明德出去買便當都沒有發現。\n\n直到一盒排骨飯放到旁邊，他才抬頭。\n\n「幾點矣？（幾點了？）」\n\n「七點外啊。（七點多了。）」\n\n廟門外的天已經暗了。\n\n阿欽揉揉發酸的後頸，再退開幾步。\n\n那片紅終於接回舊紋樣裡。\n\n新補的地方仍看得出痕跡，卻不搶眼。遠遠望去，原先斷掉的線重新連了起來，花瓣沿著牆面舒展，留住歲月磨過的顏色。\n\n他站在那裡看了一陣。\n\n「爸。」\n\n「嗯？」\n\n「明仔載你幾點來？（明天你幾點來？）」\n\n蘇明德拆開便當的橡皮筋。\n\n「八點。」\n\n「喔。」\n\n隔天早上八點十二分，阿欽騎車到了。\n\n蘇明德看了一眼牆上的鐘。\n\n「足早喔。（真早。）」\n\n「才十二分爾爾，是咧靠北喔。（十二分而已是在靠北喔。）」\n\n他拉過昨天那張矮凳，自己去找調色碟。\n\n誰也沒有正式談過接班。\n\n阿欽只是常來。\n\n先是幫忙補色，再學著處理舊紋樣。失手的地方被父親叫回去重做，兩個人也會為了一道線、一個顏色吵半天。蘇明德從不因為他是兒子便少罵一句，阿欽也從沒學會乖乖閉嘴。\n\n幾年後，「明德佛具彩繪」門口仍舊掛著原來那塊招牌。\n\n有人來找蘇師傅，也有人開始站在門口問：\n\n「阿欽師咧？」\n\n裡頭常傳來一句。\n\n「等一下啦，手有漆。」\n\n接著是拖鞋踩過老地磚的聲音。\n\n蘇柏欽掀開布簾走出來，花襯衫袖口捲到手臂，指尖還沾著一點沒洗乾淨的紅。\n\n他沒有宣布「我決定留下」。\n\n只是後來有人坐在門口喝茶，笑著問蘇明德：「你兒子現在接你的喔？」\n\n蘇明德依舊低著頭做事。\n\n「你問伊啊。（你問他啊。）」\n\n阿欽正在洗筆。\n\n水裡慢慢暈開一圈紅。\n\n他想了一下。\n\n「算是吧。」\n\n說完又低下頭，將洗乾淨的筆一支支理齊，掛回窗邊。"}]},
{id:"fu",name:"傅承億",desc:"霸道乞丐｜棲川市",portrait:"images/qichuan/fu.webp",chibi:true,stories:[{"title": "世紀商戰", "prompt": "傅承億跟陸承澤日常鬥嘴", "date": "2026-11-11", "content": "傅承億今天的心情很差。\n原因無他。\n他的商業帝國遭遇了成立以來最嚴峻的挑戰。\n隔壁的陸承澤，換了一個新碗。\n不鏽鋼材質，直徑二十公分，碗底平整，甚至還有防滑墊。\n傅承億盯著那個碗看了整整十分鐘。\n「陸承澤。」\n「嗯。」\n「你這是在挑釁。」\n陸承澤頭也沒抬，繼續整理自己的零錢。\n「我只是換個碗。」\n「呵。」\n傅承億冷笑一聲，雙手插進破大衣口袋。\n「商業競爭講究公平。你突然升級硬體設備，是想打破市場平衡？」\n「原本那個破了。」\n「藉口。」\n「……」\n「你是不是想發動價格戰？」\n陸承澤終於抬頭。\n「我們兩個都是討錢的，哪來的價格戰？」\n「注意你的用詞！」\n傅承億猛地站起來。\n「是募資！」\n「好，募資。」\n陸承澤推了推眼鏡。\n「那傅總，請問貴公司上個月營收多少？」\n「商業機密。」\n「八百六十塊？」\n「你怎麼知道？！」\n「你上禮拜自己講的。」\n「……」\n傅承億沉默兩秒。\n「那是未經審計的數據。」\n⸻\n下午三點，傅承億正式宣布啟動「企業競爭力提升計畫」。\n第一項措施，是替自己的不鏽鋼碗重新定位。\n他找來一塊紙板，用黑色麥克筆寫下：\n傅氏控股集團｜VIP 天使投資專區\n最低投資金額：10元。\n尊榮投資方案：50元。\n董事長親自致謝：100元。\n陸承澤看了一眼。\n「你這定價策略有問題。」\n「呵，終於感受到威脅了？」\n「沒有。」\n陸承澤指向最後一行。\n「誰會花一百塊聽你說謝謝？」\n傅承億露出意味深長的笑容。\n「這就是你我之間的差距。」\n「什麼差距？」\n「品牌價值。」\n話音剛落，一位路過的阿嬤停下腳步。\n傅承億立刻挺直背脊。\n「女士，歡迎了解本集團最新募資方案。」\n阿嬤看了看紙板。\n又看了看他。\n「少年欸，你是不是肚子餓？」\n「本公司目前確實有餐飲資源整合需求。」\n阿嬤從袋子裡拿出一顆茶葉蛋。\n放進他的碗裡。\n「乖，拿去吃。」\n傅承億沉默。\n陸承澤也沉默。\n三秒後。\n「……」\n傅承億緩緩拿起茶葉蛋。\n「很好。」\n「本公司成功取得實物資產。」\n陸承澤：「你要把它列入財報？」\n「當然。」\n「估值多少？」\n「一百。」\n「便利商店賣十三。」\n「那是零售價。」\n傅承億神情冷峻。\n「本集團採用情感溢價估值模型。」\n⸻\n下午四點，傅氏控股集團召開緊急董事會。\n出席人員：傅承億。\n列席人員：橘貓三號。\n會議議題：如何擊敗陸氏資本。\n傅承億拿出紙筆，嚴肅地寫下三項策略。\n一、提高品牌辨識度。\n二、優化投資者體驗。\n三、讓陸承澤破產。\n三號打了個哈欠。\n「很好。」\n傅承億滿意地點頭。\n「全票通過。」\n此時陸承澤從旁邊經過。\n「你那隻貓走了。」\n傅承億低頭。\n三號確實走了。\n「……」\n「牠是去執行市場調查。」\n「牠去吃罐頭。」\n「陸承澤，你不懂企業管理。」\n「我懂。」\n陸承澤從口袋裡拿出一張紙。\n「我剛剛算了一下，你今天的收入是四十塊，加一顆茶葉蛋。」\n「所以？」\n「你買麥克筆花了三十五。」\n「……」\n「等於今天淨賺五塊跟一顆蛋。」\n傅承億緩緩站起身。\n「陸承澤。」\n「嗯？」\n「你是不是想發動敵意併購？」\n「我只是提醒你。」\n「提醒什麼？」\n「你還欠我五十塊。」\n\n📢 傅氏控股集團晚間重大公告\n\n本公司今日成功完成品牌升級、資產重估及跨企業戰略談判，整體營運表現符合預期。\n\n針對外界關切之五十元債務，本公司重申財務結構穩健，暫無立即清償計畫。\n\n陸氏資本官方回應：\n\n「還錢。」\n\n傅氏控股集團董事長補充聲明：\n\n「呵，男人，你成功引起了我的注意。」\n\n陸氏資本第二次回應：\n\n「不要噁心我。還錢。」"}, {"title": "兩大財閥的誕生", "prompt": "陸承澤跟傅承億的相遇", "date": "2026-11-11", "content": "📍 中央車站三號出口地下道｜三年前・秋\n\n傅承億第一次見到陸承澤，是在一個下雨的星期三。\n當時傅氏控股集團成立不到兩個月，總部位於第二根柱子旁，擁有一間紙箱套房、一只不鏽鋼碗，以及一位對未來充滿信心的董事長。\n那天下午，一雙皮鞋停在他面前。\n傅承億頭也沒抬。\n「最低投資十元，五十元享戰略合作資格，一百元可獲董事長親自致謝。」\n對方沒有動靜。\n他抬頭，看見一名西裝筆挺、戴著細框眼鏡的男人。\n看起來很有錢。\n至少比他有錢。\n「先生，你很有眼光。」\n傅承億站起身，伸出右手。\n「能在本集團上市前發現投資價值，足以證明你的商業嗅覺。請問貴姓？」\n「陸。」\n「陸先生，我欣賞你。」\n男人沉默兩秒。\n「我只是想問，旁邊有人嗎？」\n「……什麼？」\n「第三根柱子。」\n「沒有。」\n「好，謝謝。」\n陸承澤走了過去。\n接著從公事包裡拿出折疊坐墊、不鏽鋼碗，以及一張寫著「陸氏資本｜歡迎長期支持」的紙板。\n坐下。\n傅承億：「……」\n五秒後。\n「你在做什麼？！」\n「營業。」\n「營什麼業？！」\n「跟你一樣。」\n傅承億深吸一口氣。\n「你知道這裡是誰的地盤嗎？」\n陸承澤環顧四周。\n「台鐵？」\n「是傅氏控股集團！」\n「你有營業登記嗎？」\n「……」\n「土地使用權？」\n「……」\n「排他性經營契約？」\n傅承億冷笑。\n「看來你是有備而來。」\n⸻\n兩小時後。\n陸承澤的碗裡有七十三塊。\n傅承億只有二十六塊。\n更可怕的是，陸承澤什麼都沒做。\n「陸承澤。」\n「嗯？」\n「你是不是買流量？」\n「什麼？」\n「你的募資轉換率不合理。」\n「可能因為我沒有一直叫路人投資。」\n「……」\n「也沒有跟阿嬤說準備收購台積電。」\n「那是企業願景！」\n陸承澤推了推眼鏡。\n「有沒有可能，問題出在董事長身上？」\n傅承億震驚了。\n他從未見過如此卑鄙的商業攻擊。\n⸻\n晚上七點，雨水滲進地下道。\n傅承億的紙箱屋頂漏了。\n「你屋頂破了。」陸承澤說。\n「建築壓力測試。」\n「褲子濕了。」\n「防水性能評估。」\n「筆電快淋到了。」\n「操！」\n傅承億猛地抱起筆電。\n陸承澤嘆氣，遞來一塊塑膠布。\n「拿去。」\n傅承億神情複雜。\n「你是不是想入股？」\n「沒有。」\n「想取得經營權？」\n「沒有。」\n「看上本集團的潛力？」\n「你到底要不要？」\n傅承億立刻接過。\n「本公司接受戰略合作。」\n⸻\n晚上九點。\n傅承億餓了。\n口袋只有十八塊，買不起二十八元的飯糰。\n他走向第三根柱子。\n「陸承澤，本公司有短期融資需求。」\n「多少？」\n「五十。」\n「你下午不是說要收購我？」\n「收購與融資並不衝突。」\n「什麼時候還？」\n「待下一輪融資完成。」\n「講人話。」\n「有錢就還。」\n陸承澤看了他幾秒，竟然真的拿出五十塊。\n傅承億接過，神情深沉。\n「你做了一個正確的決定。」\n「我開始後悔了。」\n「今日這五十元，將成為兩大商業帝國合作的起點。」\n「記得還。」\n「未來你我必將共同站上資本市場的頂峰。」\n「記得還。」\n「屆時，我不會忘記今日的雪中送炭。」\n「記得還。」\n傅承億不耐煩地皺眉。\n「你這個人怎麼滿腦子都是錢？」\n陸承澤：「……」\n⸻\n三天後。\n陸承澤發現傅承億的公司組織圖上多了自己的名字。\n傅氏控股集團\n董事長：傅承億\n戰略合作夥伴：陸承澤\n公關部主管：橘貓三號\n「我什麼時候加入你公司了？」\n「從你完成天使輪投資那刻。」\n「那五十塊是借你的。」\n「資本市場沒有永遠的債權人，只有尚未理解企業願景的投資者。」\n陸承澤拿起筆，在自己名字旁補上：\n債權人。\n傅承億補：\n兼戰略合作夥伴。\n陸承澤：\n欠款五十元。\n傅承億：\n預計上市後清償。\n陸承澤：\n請勿相信。\n傅承億：\n競業惡意抹黑。\n兩人寫了十分鐘。\n最後因為紙板不夠大，被迫停戰。\n⸻\n那晚，傅承億望向隔壁。\n「陸承澤，你為什麼來這裡？」\n「想換一種活法。」\n傅承億愣了一下，隨即笑了。\n「呵，看來我們是同道中人。」\n「你也是？」\n「這世界太多人被金錢束縛，而我選擇成為金錢的主人。」\n「……」\n「有錢是能力，沒錢是選擇。」\n陸承澤沉默片刻。\n「所以你選擇欠我五十塊？」\n「……」\n傅承億猛地站起身。\n「從明天開始，我們就是敵人！」\n「好。」\n「商場如戰場！」\n「嗯。」\n「總有一天，我會收購你的公司！」\n「可以。」\n「到時候你就等著跪下來求我！」\n陸承澤平靜地看著他。\n「那你明天還借不借充電線？」\n「……」\n「借。」\n⸻\n後記｜三年後\n傅氏控股集團與陸氏資本至今仍維持激烈競爭，每年召開地下道商業領袖高峰會。\n與會人數：兩人。\n會議地點：第三根柱子旁。\n主要議題：市場拓展、資產配置、橘貓罐頭預算。\n至於那筆五十元債務——\n至今尚未清償。\n陸承澤：「當初就不該借他。」\n傅承億：「呵，這叫長期戰略融資。」"}]},

const volumes={qichuan:{name:"棲川市",en:"QICHUAN CITY",desc:"那些生活在同一座城市裡的人，與尚未寫完的故事。",ids:["wen","xu","you","du","cheng","lin","jian","su","fu"]},null:{name:"NULL",en:"PREDICT / ARCHIVE",desc:"風險不等於犯罪，預測不等於事實。翻閱那些無法被評級定義的人。",ids:["miran","elaine","noa","kael","sian","vera","arthur","rae","liane"]},other:{name:"其他角色",en:"OTHER STORIES",desc:"獨立於兩本刊物之外的角色故事。",ids:["lu"]}};
characters.push(
{id:"miran",name:"Miran Veyss",desc:"PREDICT 人格風險校準官｜MODERATE",portrait:"images/null/p001.jpg",stories:[]},
{id:"elaine",name:"Elaine Rovell",desc:"中央風險治理特別監察官｜LOW",portrait:"images/null/p002.jpg",stories:[]},
{id:"noa",name:"Noa Seiler",desc:"臨床心理師｜MODERATE",portrait:"images/null/p003.jpg",stories:[]},
{id:"kael",name:"Kael Vaughn",desc:"NULL 觀察機構安全主管｜LOW",portrait:"images/null/p004.jpg",stories:[]},
{id:"sian",name:"Sian Lorne",desc:"鐘錶修復師｜HIGH",portrait:"images/null/p005.jpg",stories:[]},
{id:"vera",name:"Vera Kain",desc:"家具修復｜CRITICAL",portrait:"images/null/p006.jpg",stories:[]},
{id:"arthur",name:"Arthur Lind",desc:"市民服務中心職員｜MODERATE",portrait:"images/null/p007.jpg",stories:[]},
{id:"rae",name:"Rae Chen",desc:"PREDICT 維護工程師｜MODERATE",portrait:"images/null/p008.jpg",stories:[]},
{id:"liane",name:"Liane Hess",desc:"大學統計／公共政策副教授｜LOW",portrait:"images/null/p009.jpg",stories:[]}
);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeImage(src){const v=String(src||"").trim();return /^(https:\/\/|\.\/|images\/|assets\/)/i.test(v)&&!/[<>"\x00-\x1f]/.test(v)?esc(v):""}
function coverMarkup(src,label){const url=safeImage(src);return url?'<img src="'+url+'" alt="'+esc(label)+'" loading="lazy">':'<span aria-hidden="true">✦</span>'}
function imageGallery(story){const cover=safeImage(story.cover);const images=Array.isArray(story.images)?story.images:[];return (cover?'<img class="story-cover" src="'+cover+'" alt="'+esc(story.title)+' 封面" loading="lazy">':"")+images.map((item,i)=>{const img=typeof item==="string"?{src:item}:item||{};const src=safeImage(img.src);return src?'<figure class="story-figure"><img src="'+src+'" alt="'+esc(img.alt||story.title+" 插圖 "+(i+1))+'" loading="lazy">'+(img.caption?'<figcaption>'+esc(img.caption)+'</figcaption>':"")+'</figure>':""}).join("")}
function render(){
const parts=location.hash.slice(1).split("/").filter(Boolean);
let volumeKey=parts[0]==="volume"?parts[1]:null;
let id=parts[0]==="volume"?parts[2]:parts[0];
let idx=parts[0]==="volume"?parts[3]:parts[1];
const c=characters.find(x=>x.id===id);
if(c&&!volumeKey)volumeKey=Object.keys(volumes).find(k=>volumes[k].ids.includes(c.id));
const volume=volumeKey&&Object.prototype.hasOwnProperty.call(volumes,volumeKey)?volumes[volumeKey]:null;
document.body.classList.toggle("null-volume",volumeKey==="null");
document.title=(c?c.name+"｜":volume?volume.name+"｜":"角色故事｜")+"岔頁 OFF PAGE";
if(!volume){
app.innerHTML='<div class="eyebrow">OFF PAGE / STORY PUBLICATIONS</div><h1>角色故事</h1><p class="lede">兩本刊物，兩種截然不同的世界。請選擇想翻開的那一本。</p><div class="volumes"><button class="volume" data-volume="qichuan"><img class="cover-art qc" src="./images/qichuan-cover.webp" alt="棲川市刊物封面"><span class="edition">VOL. 01 / QICHUAN CITY</span><strong>棲川市</strong><span class="summary">'+esc(volumes.qichuan.desc)+'</span><span class="enter">翻開刊物 →</span></button><button class="volume null-cover" data-volume="null"><img class="cover-art nl" src="./images/null-cover.webp" alt="NULL 刊物封面"><span class="edition">VOL. 02 / PREDICT</span><strong>NULL</strong><span class="summary">'+esc(volumes.null.desc)+'</span><span class="enter">開啟檔案 →</span></button></div><div class="extra-link">還有獨立角色故事　<button data-volume="other">查看其他角色 →</button></div>';
app.querySelectorAll("[data-volume]").forEach(b=>b.onclick=()=>location.hash="/volume/"+b.dataset.volume);
window.scrollTo(0,0);return;
}
const base="/volume/"+volumeKey;
if(!c||!volume.ids.includes(c.id)){
const people=volume.ids.map(id=>characters.find(x=>x.id===id)).filter(Boolean);
app.innerHTML='<div class="crumb"><button id="all">角色故事</button> / '+esc(volume.name)+'</div><div class="eyebrow">'+esc(volume.en)+' / CHARACTER INDEX</div><h1>'+esc(volume.name)+'</h1><p class="lede">'+esc(volume.desc)+'</p><div class="grid">'+people.map((x,i)=>'<button class="person" data-id="'+esc(x.id)+'"><div class="thumb'+(x.portrait?(x.chibi?' chibi':' has-img'):'')+'">'+coverMarkup(x.portrait,x.name)+'</div><span class="num">CHARACTER '+String(i+1).padStart(2,"0")+'</span><strong>'+esc(x.name)+'</strong><span class="desc">'+esc(x.desc)+'</span><span class="go">'+(x.stories.length?x.stories.length+" 篇故事":"故事目錄")+' →</span></button>').join("")+'</div>';
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>location.hash=base+"/"+b.dataset.id);
window.scrollTo(0,0);return;
}
const n=idx===undefined?NaN:Number(idx),story=Number.isInteger(n)&&n>=0?c.stories[n]:null;
const crumb='<div class="crumb"><button id="all">角色故事</button> / <button id="volume">'+esc(volume.name)+'</button> / '+esc(c.name)+(story?' / '+esc(story.title):'')+'</div>';
if(!story){
app.innerHTML=crumb+'<div class="eyebrow">CHARACTER FILE / '+esc(c.id.toUpperCase())+'</div><h1>'+esc(c.name)+'</h1><p class="lede">'+esc(c.desc)+'</p>'+(c.stories.length?'<ol class="story-list">'+c.stories.map((s,i)=>'<li><button data-story="'+i+'"><span class="entry"><span class="mini">'+coverMarkup(s.cover,s.title)+'</span><span class="entry-text"><span>'+String(i+1).padStart(2,"0")+'　'+esc(s.title)+'</span><small>'+esc(s.prompt||s.date||"")+'</small></span></span><small>閱讀 →</small></button></li>').join("")+'</ol>':'<div class="empty">這位角色的故事正在整理中，敬請期待。</div>');
app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>location.hash=base+"/"+c.id+"/"+b.dataset.story);
}else{
app.innerHTML=crumb+'<article class="paper"><div class="eyebrow">'+esc(c.name)+' / STORY '+String(n+1).padStart(2,"0")+'</div><h1>'+esc(story.title)+'</h1><p class="eyebrow">'+esc(story.date||"")+'</p>'+(story.prompt?'<p class="prompt"><span>故事提示語</span>'+esc(story.prompt)+'</p>':'')+imageGallery(story)+'<div class="prose">'+esc(story.content)+'</div></article><div class="controls"><button id="prev" '+(n===0?"disabled":"")+'>← 上一篇</button><button id="catalog">返回故事目錄</button><button id="next" '+(n===c.stories.length-1?"disabled":"")+'>下一篇 →</button></div>';
app.querySelector("#catalog").onclick=()=>location.hash=base+"/"+c.id;
app.querySelector("#prev").onclick=()=>location.hash=base+"/"+c.id+"/"+(n-1);
app.querySelector("#next").onclick=()=>location.hash=base+"/"+c.id+"/"+(n+1);
}
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelector("#volume").onclick=()=>location.hash=base;
window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
</script></body></html>
