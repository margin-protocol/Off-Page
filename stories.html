<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色故事｜岔頁 OFF PAGE</title><meta name="description" content="岔頁角色故事館：選擇角色，翻閱各自的故事。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap"><style>
:root{--cream:#F7F3EC;--paper:#FFFDF9;--berry:#772F49;--ink:#29272B;--muted:#8A626E;--rule:#E7DBDC}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.9 "LXGW WenKai TC",serif}a{color:inherit}button{font:inherit;cursor:pointer;color:inherit;appearance:none}button:focus-visible,a:focus-visible{outline:2px solid var(--berry);outline-offset:3px}header{position:sticky;top:0;z-index:3;background:rgba(247,243,236,.97);border-bottom:1px solid var(--rule)}.wrap{max-width:1060px;margin:auto;padding:0 22px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px;flex-wrap:wrap}.logo{text-decoration:none;font-size:25px;color:var(--berry);font-weight:700}.logo small{font-size:13px;color:var(--muted);margin-left:10px}.back{font-size:14px;text-decoration:none;border-bottom:1px solid var(--berry);color:var(--berry)}main.wrap{padding:55px 22px 100px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);line-height:1.35;margin:10px 0 12px;color:var(--berry)}.lede{color:#5a5560;max-width:650px;margin:0 0 42px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.person{background:var(--paper);border:1px solid var(--rule);padding:26px;text-align:left;min-height:190px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}.person:hover{transform:translateY(-3px);border-color:var(--berry)}.person .thumb{height:145px;margin:-26px -26px 15px;background:linear-gradient(135deg,#EBCBD3,#F7F3EC,#D7B6A8);display:grid;place-items:center;overflow:hidden}.person .thumb img{width:100%;height:100%;object-fit:cover}.person .thumb span{font-size:40px;color:var(--berry)}.person .num{font-size:12px;color:var(--muted);letter-spacing:.16em}.person strong{font-size:27px}.person .desc{font-size:14px;color:#5a5560}.person .go{margin-top:auto;color:var(--berry);font-size:14px}.crumb{font-size:14px;color:var(--muted);margin-bottom:25px}.crumb button{border:0;background:none;color:var(--berry);padding:0}.story-list{list-style:none;padding:0;margin:30px 0;border-top:1px solid var(--ink)}.story-list li{border-bottom:1px solid var(--rule)}.story-list .entry{display:flex;align-items:center;gap:16px}.story-list .mini{width:76px;height:92px;flex:none;background:#EBCBD3;display:grid;place-items:center;color:var(--berry)}.story-list .mini img{width:100%;height:100%;object-fit:cover}.story-list .entry-text{display:flex;flex-direction:column}.story-list button{width:100%;border:0;background:none;padding:20px 4px;text-align:left;display:flex;justify-content:space-between;gap:20px}.story-list button:hover{color:var(--berry)}.story-list small{color:var(--muted)}.paper{background:var(--paper);border:1px solid var(--rule);padding:clamp(24px,5vw,60px);max-width:780px}.paper h1{color:var(--ink);font-size:36px}.story-cover,.story-figure img{display:block;width:100%;height:auto;border:1px solid var(--rule)}.story-cover{max-height:490px;object-fit:cover;margin:0 0 28px}.story-figure{margin:28px 0}.story-figure figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}.prose{white-space:pre-wrap;line-height:2.15;overflow-wrap:anywhere}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.controls button{border:1px solid var(--rule);background:var(--paper);padding:8px 16px;color:var(--berry)}.controls button:disabled{opacity:.35;cursor:default}.empty{background:var(--paper);border:1px dashed var(--rule);padding:38px 24px;color:var(--muted)}footer{border-top:1px solid var(--rule);padding:24px 0;color:var(--muted);font-size:13px}@media(max-width:500px){main.wrap{padding-top:35px}.person{min-height:155px}}
body.null-volume{--cream:#111113;--paper:#1b1b1e;--berry:#e8e8ea;--ink:#f2f2f0;--muted:#8f9096;--rule:#34353a;color:var(--ink)}body.null-volume header{background:rgba(17,17,19,.97)}body.null-volume .lede,body.null-volume .person .desc{color:#b4b5ba}body.null-volume .person .thumb{background:linear-gradient(135deg,#2a2b30,#1b1b1e,#3a3b40)}body.null-volume .person .num{letter-spacing:.24em}.person .thumb.chibi{height:auto;aspect-ratio:1/1;background:#000}.person .thumb.chibi img{transition:transform .35s}.person:hover .thumb.chibi img{transform:scale(1.04)}.person .thumb.has-img{height:auto;aspect-ratio:4/5}.person .thumb.has-img img{object-position:center 22%}.volumes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px}.volume{display:flex;flex-direction:column;text-align:left;min-height:310px;padding:32px;border:1px solid var(--rule);background:var(--paper);transition:transform .2s}.volume:hover{transform:translateY(-4px);border-color:var(--berry)}.volume .cover-art{height:auto;aspect-ratio:4/5;object-fit:cover;display:block;margin:-32px -32px 22px;width:calc(100% + 64px);max-width:none;border-bottom:1px solid var(--rule)}.volume .cover-art.qc{object-position:85% center}.volume .cover-art.nl{object-position:center 22%}.volume .edition{font-size:12px;letter-spacing:.22em;color:var(--muted)}.volume strong{font-size:clamp(34px,5vw,56px);color:var(--berry);line-height:1.3;margin:24px 0 8px}.volume .summary{font-size:15px;line-height:1.8}.volume .enter{margin-top:auto;padding-top:16px;color:var(--berry)}.volume.null-cover{background:#141416;color:#d6d7db;border-color:#2c2d31}.volume.null-cover strong{color:#f2f2f0;letter-spacing:.08em}.volume.null-cover .enter{color:#f2f2f0}.volume.null-cover .edition{color:#8f9096}.volume.null-cover:hover{border-color:#d6d7db}.extra-link{margin-top:35px;color:var(--muted);font-size:14px}.extra-link button{background:none;border:0;border-bottom:1px solid currentColor;color:var(--berry)}@media(max-width:620px){.volumes{grid-template-columns:1fr}.volume{min-height:235px}}</style></head><body><header><div class="wrap head"><a class="logo" href="./index.html#home">岔頁 <small>OFF PAGE</small></a><a class="back" href="./index.html#home">返回首頁 ↗</a></div></header><main class="wrap" id="app"></main><footer><div class="wrap">OFF PAGE — by Xia mumu · CHARACTER ARCHIVE</div></footer><script>
/* 故事可附圖：{title:"標題",content:"正文",date:"2026-11-11",cover:"images/cover.jpg",images:[{src:"images/scene.jpg",caption:"圖說"}]}。 */
const characters=[
{id:"wen",name:"聞止水",desc:"紀實攝影師｜棲川市",portrait:"images/qichuan/wen.webp",chibi:true,stories:[]},
{id:"xu",name:"徐汀云",desc:"犯罪學副教授｜棲川市",portrait:"images/qichuan/xu.webp",chibi:true,stories:[]},
{id:"you",name:"游未遲",desc:"法醫｜棲川市",portrait:"images/qichuan/you.webp",chibi:true,stories:[]},
{id:"du",name:"杜今朝",desc:"刑警｜棲川市",portrait:"images/qichuan/du.webp",chibi:true,stories:[]},
{id:"cheng",name:"程不言",desc:"刑事辯護律師｜棲川市",portrait:"images/qichuan/cheng.webp",chibi:true,stories:[]},
{id:"lin",name:"林晏洄",desc:"環保顧問｜棲川市",portrait:"images/qichuan/lin.webp",chibi:true,stories:[]},
{id:"jian",name:"簡牧陽",desc:"空間設計師｜棲川市",portrait:"images/qichuan/jian.webp",chibi:true,stories:[]},
{id:"su",name:"蘇柏欽",desc:"廟宇彩繪與神像修復師｜棲川市",portrait:"images/qichuan/su.webp",chibi:true,stories:[]},
{id:"fu",name:"傅承億",desc:"霸道乞丐｜棲川市",portrait:"images/qichuan/fu.webp",chibi:true,stories:[]},
{id:"lu",name:"陸承澤",desc:"從敵人到搭檔",stories:[]}
];
const volumes={qichuan:{name:"棲川市",en:"QICHUAN CITY",desc:"那些生活在同一座城市裡的人，與尚未寫完的故事。",ids:["wen","xu","you","du","cheng","lin","jian","su","fu"]},null:{name:"NULL",en:"PREDICT / ARCHIVE",desc:"風險不等於犯罪，預測不等於事實。翻閱那些無法被評級定義的人。",ids:["miran","elaine","noa","kael","sian","vera","arthur","rae","liane"]},other:{name:"其他角色",en:"OTHER STORIES",desc:"獨立於兩本刊物之外的角色故事。",ids:["lu"]}};
characters.push(
{id:"miran",name:"Miran Veyss",desc:"PREDICT 人格風險校準官｜MODERATE",portrait:"images/null/p001.jpg",stories:[]},
{id:"elaine",name:"Elaine Rovell",desc:"中央風險治理特別監察官｜LOW",portrait:"images/null/p002.jpg",stories:[]},
{id:"noa",name:"Noa Seiler",desc:"臨床心理師｜MODERATE",portrait:"images/null/p003.jpg",stories:[]},
{id:"kael",name:"Kael Vaughn",desc:"NULL 觀察機構安全主管｜LOW",portrait:"images/null/p004.jpg",stories:[]},
{id:"sian",name:"Sian Lorne",desc:"鐘錶修復師｜HIGH",portrait:"images/null/p005.jpg",stories:[]},
{id:"vera",name:"Vera Kain",desc:"家具修復｜CRITICAL",portrait:"images/null/p006.jpg",stories:[]},
{id:"arthur",name:"Arthur Lind",desc:"市民服務中心職員｜MODERATE",portrait:"images/null/p007.jpg",stories:[]},
{id:"rae",name:"Rae Chen",desc:"PREDICT 維護工程師｜MODERATE",portrait:"images/null/p008.jpg",stories:[]},
{id:"liane",name:"Liane Hess",desc:"大學統計／公共政策副教授｜LOW",portrait:"images/null/p009.jpg",stories:[]}
);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeImage(src){const v=String(src||"").trim();return /^(https:\/\/|\.\/|images\/|assets\/)/i.test(v)&&!/[<>"\x00-\x1f]/.test(v)?esc(v):""}
function coverMarkup(src,label){const url=safeImage(src);return url?'<img src="'+url+'" alt="'+esc(label)+'" loading="lazy">':'<span aria-hidden="true">✦</span>'}
function imageGallery(story){const cover=safeImage(story.cover);const images=Array.isArray(story.images)?story.images:[];return (cover?'<img class="story-cover" src="'+cover+'" alt="'+esc(story.title)+' 封面" loading="lazy">':"")+images.map((item,i)=>{const img=typeof item==="string"?{src:item}:item||{};const src=safeImage(img.src);return src?'<figure class="story-figure"><img src="'+src+'" alt="'+esc(img.alt||story.title+" 插圖 "+(i+1))+'" loading="lazy">'+(img.caption?'<figcaption>'+esc(img.caption)+'</figcaption>':"")+'</figure>':""}).join("")}
function render(){
const parts=location.hash.slice(1).split("/").filter(Boolean);
let volumeKey=parts[0]==="volume"?parts[1]:null;
let id=parts[0]==="volume"?parts[2]:parts[0];
let idx=parts[0]==="volume"?parts[3]:parts[1];
const c=characters.find(x=>x.id===id);
if(c&&!volumeKey)volumeKey=Object.keys(volumes).find(k=>volumes[k].ids.includes(c.id));
const volume=volumeKey&&Object.prototype.hasOwnProperty.call(volumes,volumeKey)?volumes[volumeKey]:null;
document.body.classList.toggle("null-volume",volumeKey==="null");
document.title=(c?c.name+"｜":volume?volume.name+"｜":"角色故事｜")+"岔頁 OFF PAGE";
if(!volume){
app.innerHTML='<div class="eyebrow">OFF PAGE / STORY PUBLICATIONS</div><h1>角色故事</h1><p class="lede">兩本刊物，兩種截然不同的世界。請選擇想翻開的那一本。</p><div class="volumes"><button class="volume" data-volume="qichuan"><img class="cover-art qc" src="./images/qichuan-cover.webp" alt="棲川市刊物封面"><span class="edition">VOL. 01 / QICHUAN CITY</span><strong>棲川市</strong><span class="summary">'+esc(volumes.qichuan.desc)+'</span><span class="enter">翻開刊物 →</span></button><button class="volume null-cover" data-volume="null"><img class="cover-art nl" src="./images/null-cover.webp" alt="NULL 刊物封面"><span class="edition">VOL. 02 / PREDICT</span><strong>NULL</strong><span class="summary">'+esc(volumes.null.desc)+'</span><span class="enter">開啟檔案 →</span></button></div><div class="extra-link">還有獨立角色故事　<button data-volume="other">查看其他角色 →</button></div>';
app.querySelectorAll("[data-volume]").forEach(b=>b.onclick=()=>location.hash="/volume/"+b.dataset.volume);
window.scrollTo(0,0);return;
}
const base="/volume/"+volumeKey;
if(!c||!volume.ids.includes(c.id)){
const people=volume.ids.map(id=>characters.find(x=>x.id===id)).filter(Boolean);
app.innerHTML='<div class="crumb"><button id="all">角色故事</button> / '+esc(volume.name)+'</div><div class="eyebrow">'+esc(volume.en)+' / CHARACTER INDEX</div><h1>'+esc(volume.name)+'</h1><p class="lede">'+esc(volume.desc)+'</p><div class="grid">'+people.map((x,i)=>'<button class="person" data-id="'+esc(x.id)+'"><div class="thumb'+(x.portrait?(x.chibi?' chibi':' has-img'):'')+'">'+coverMarkup(x.portrait,x.name)+'</div><span class="num">CHARACTER '+String(i+1).padStart(2,"0")+'</span><strong>'+esc(x.name)+'</strong><span class="desc">'+esc(x.desc)+'</span><span class="go">'+(x.stories.length?x.stories.length+" 篇故事":"故事目錄")+' →</span></button>').join("")+'</div>';
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>location.hash=base+"/"+b.dataset.id);
window.scrollTo(0,0);return;
}
const n=idx===undefined?NaN:Number(idx),story=Number.isInteger(n)&&n>=0?c.stories[n]:null;
const crumb='<div class="crumb"><button id="all">角色故事</button> / <button id="volume">'+esc(volume.name)+'</button> / '+esc(c.name)+(story?' / '+esc(story.title):'')+'</div>';
if(!story){
app.innerHTML=crumb+'<div class="eyebrow">CHARACTER FILE / '+esc(c.id.toUpperCase())+'</div><h1>'+esc(c.name)+'</h1><p class="lede">'+esc(c.desc)+'</p>'+(c.stories.length?'<ol class="story-list">'+c.stories.map((s,i)=>'<li><button data-story="'+i+'"><span class="entry"><span class="mini">'+coverMarkup(s.cover,s.title)+'</span><span class="entry-text"><span>'+String(i+1).padStart(2,"0")+'　'+esc(s.title)+'</span><small>'+esc(s.date||"")+'</small></span></span><small>閱讀 →</small></button></li>').join("")+'</ol>':'<div class="empty">這位角色的故事正在整理中，敬請期待。</div>');
app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>location.hash=base+"/"+c.id+"/"+b.dataset.story);
}else{
app.innerHTML=crumb+'<article class="paper"><div class="eyebrow">'+esc(c.name)+' / STORY '+String(n+1).padStart(2,"0")+'</div><h1>'+esc(story.title)+'</h1><p class="eyebrow">'+esc(story.date||"")+'</p>'+imageGallery(story)+'<div class="prose">'+esc(story.content)+'</div></article><div class="controls"><button id="prev" '+(n===0?"disabled":"")+'>← 上一篇</button><button id="catalog">返回故事目錄</button><button id="next" '+(n===c.stories.length-1?"disabled":"")+'>下一篇 →</button></div>';
app.querySelector("#catalog").onclick=()=>location.hash=base+"/"+c.id;
app.querySelector("#prev").onclick=()=>location.hash=base+"/"+c.id+"/"+(n-1);
app.querySelector("#next").onclick=()=>location.hash=base+"/"+c.id+"/"+(n+1);
}
app.querySelector("#all").onclick=()=>location.hash="/";
app.querySelector("#volume").onclick=()=>location.hash=base;
window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
</script></body></html>
