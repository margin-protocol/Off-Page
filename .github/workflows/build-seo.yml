# 改了 index.html（新增咒語、作品、公告、常見問題）推上來之後，
# 自動重新產生各分頁、每則小咒語的頁面、sitemap.xml 和 llms.txt。
name: 自動更新分頁與小咒語頁面

on:
  push:
    branches: [main]
    paths: ['index.html', 'scripts/build_seo.py']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-seo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 產生頁面
        run: python3 scripts/build_seo.py

      - name: 有變動就存回 repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "頁面已經是最新的，不用更新。"
            exit 0
          fi
          git commit -m "自動更新分頁與小咒語頁面"
          git pull --rebase origin main
          git push
          # 確保 GitHub Pages 重新部署
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
